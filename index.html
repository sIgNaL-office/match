<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sIgNaL Match</title>
<meta name="theme-color" content="#2a3666">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="sIgNaL Match">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 上部ヘッダー＋画面切替のアプリ。スマホは1列 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#1d2433; --muted:#5f6878; --line:#dde2e0;
  --green:#3f8f68; --accent:#2f6f74; --accent-soft:#e3efec;
  --s:#b4372f; --a:#c97a12; --b:#2f6f74; --c:#6a7488; --d:#9aa0ab;
  --warn-bg:#fff4dc; --warn-fg:#7a5400; --err-bg:#fbe9e7;
  --font-d:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-b:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12161c; --surface:#1b2129; --fg:#e7ebef; --muted:#9aa4b2; --line:#2c3440;
  --green:#6cc093; --accent:#6cb7b0; --accent-soft:#1f3433;
  --s:#ef7b72; --a:#e9a64a; --b:#6cb7b0; --c:#9aa4b8; --d:#6e7480;
  --warn-bg:#3a2f15; --warn-fg:#f1cf82; --err-bg:#3a1f1d; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:14px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .inner{max-width:1040px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:700;font-size:16px;white-space:nowrap}
.brand img{width:28px;height:auto}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button,nav.tabs a{font:inherit;font-weight:500;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;text-decoration:none}
nav.tabs [aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.who{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.who button{font:inherit;border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-family:var(--font-d);font-size:21px;margin:20px 0 4px;text-wrap:balance}
h2{font-family:var(--font-d);font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 14px;font-size:13px}
.btn{font:inherit;font-weight:700;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;background:var(--accent);color:var(--surface);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn[disabled]{opacity:.55;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{width:auto;min-width:120px}
.filters input{flex:1}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.item:hover{border-color:var(--accent)}
.item.norank{grid-template-columns:1fr auto}
.rank{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-m);font-weight:500;font-size:18px;color:#fff;background:var(--line)}
.rank.S{background:var(--s)}.rank.A{background:var(--a)}.rank.B{background:var(--b)}.rank.C{background:var(--c)}.rank.D{background:var(--d)}
.rank.none{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.item .t{font-weight:700}
.item .m{font-size:12.5px;color:var(--muted);display:block}
.price{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-weight:500;text-align:right;white-space:nowrap}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;font-weight:500;vertical-align:1px;white-space:nowrap}
.chip.priv{border-color:var(--s);color:var(--s)}
.chip.need{border-color:var(--warn-fg);color:var(--warn-fg);background:var(--warn-bg)}
.subtabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:10px 16px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--green)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}
.f{min-width:0}
.f>label,.f>.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:500}
.f.full{grid-column:1/-1}
.f .other{margin-top:6px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label,.inline{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg);font-weight:400}
.checks input,.inline input{width:auto}
.f.auto input,.f.auto select,.f.auto textarea{border-color:var(--green);background:var(--accent-soft)}
.f.auto>label::after,.f.auto>.lbl::after{content:"読取";margin-left:6px;font-size:10.5px;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:0 4px}
.f.tbc input:not([type=checkbox]),.f.tbc select,.f.tbc textarea{border:2px solid var(--s)}
.f.tbc>label,.f.tbc>.lbl{color:var(--s)}
.f.tbc>label::after,.f.tbc>.lbl::after{content:"要確認";margin-left:6px;font-size:10.5px;color:#fff;background:var(--s);border-radius:4px;padding:0 5px}
.grp{border:1px solid transparent;border-radius:6px;padding:6px 8px}
.grp.auto{border-color:var(--green);background:var(--accent-soft)}
.grp.tbc{border:2px solid var(--s)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:6px 0 2px}
.lg::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.lg.auto::before{border:1px solid var(--green);background:var(--accent-soft)}
.lg.tbc::before{border:2px solid var(--s)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--muted);display:grid;align-content:center;gap:4px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{border:0;padding:6px 0;background:transparent}
.drop small{font-size:11.5px}
.section-label{font-size:11.5px;letter-spacing:.08em;color:var(--green);font-weight:700;margin:18px 0 8px}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--accent)}
details.more .grid{margin-top:12px}
.note{background:var(--warn-bg);color:var(--warn-fg);font-size:12.5px;padding:8px 12px;border-radius:6px;margin:8px 0}
.err{background:var(--err-bg);color:var(--s);font-size:13px;padding:10px 12px;border-radius:6px;margin:10px 0}
.dtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.dtabs button{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer}
.dtabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.back{font:inherit;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;margin-top:16px}
.sheet-wrap{overflow-x:auto;background:#e9ecea;border-radius:8px;padding:16px}
.sheet-wrap>div{box-shadow:0 2px 10px rgba(0,0,0,.08);padding:16px;min-width:600px}
.cands{display:grid;gap:8px}
.cand{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.cand .n{font-family:var(--font-m);color:var(--green);font-size:18px}
.cand .why{font-size:12.5px;color:var(--muted)}
.cand a{color:var(--fg);font-weight:700;text-decoration:none;cursor:pointer}
.score{font-family:var(--font-m);font-size:13px;text-align:right;display:grid;gap:6px;justify-items:end}
.bar{height:6px;width:90px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--s);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700}
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
.xpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xpair>div{min-width:0;border-left:3px solid var(--line);padding-left:8px}
.xpair>div.other{border-left-color:var(--accent)}
.xpair .lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.xpair a{color:var(--fg);font-weight:700;text-decoration:none;cursor:pointer}
.xpair .why,.xcard .why{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.xhead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.xhead .score{display:flex;gap:8px;align-items:center}
.xsec{display:grid;gap:8px;margin-bottom:22px}
@media (max-width:560px){.xpair{grid-template-columns:1fr}}
.ranknote{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
pre.msg{white-space:pre-wrap;font-family:var(--font-b);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 8px;min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two>*{min-width:0}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.log{width:100%;border-collapse:collapse;font-size:13px}
.log th,.log td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.log th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.files{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-top:8px}
.files a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;z-index:20;max-width:92vw;text-align:center}
.empty{color:var(--muted);padding:28px 16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:8px}
.center{max-width:440px;margin:12vh auto 0;text-align:center;display:grid;gap:14px;justify-items:center}
.center img{width:90px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:560px){.item{grid-template-columns:40px 1fr}.item .price{grid-column:2;text-align:left}.who{margin-left:0}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header class="top" id="hdr" hidden><div class="inner">
  <div class="brand"><img id="logo" alt="sIgNaL">Match</div>
  <nav class="tabs" aria-label="画面">
    <button data-go="list">案件一覧</button>
    <button data-go="new">登録</button>
    <button data-go="buyers">取引先</button>
    <button data-go="xm">社内マッチ<span class="badge" id="xb" hidden></span></button>
    <a id="sheetLink" target="_blank" rel="noopener" hidden>スプレッドシート</a>
  </nav>
  <div class="who"><span id="meName"></span><button id="logout">ログアウト</button></div>
</div></header>
<main class="wrap" id="app"><div class="center"><span><span class="spin"></span>読み込み中…</span></div></main>
<div id="toast" class="toast" hidden></div>

<script>
/* ===== 基本 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls = { get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }, set(k,v){ try { v ? localStorage.setItem(k,v) : localStorage.removeItem(k); } catch(e){} } };
let TOKEN = BOOT.token || ls.get('sg_token');
if (BOOT.token) ls.set('sg_token', BOOT.token);
const S = { view: 'list', listKind: 'deal', newKind: 'deal', dtab: 'gaiyo', cache: {} };

function toast(t, ms){ const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, ms || 2600); }
function api(action, args){
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, action: action, args: args || {} }), redirect: 'follow' })
    .then(r => { if (!r.ok) throw new Error('サーバーの応答がありません（' + r.status + '）'); return r.json(); }, () => { throw new Error('通信に失敗しました。電波の良いところでもう一度お試しください'); })
    .then(r => {
      if (r && r.error) {
        if (r.error === 'LOGIN') { showLogin(); throw new Error('ログインが必要です'); }
        if (/^NOUSER:/.test(r.error)) { showNoUser(r.error.slice(7)); throw new Error('利用者に登録されていません'); }
        throw new Error(r.error);
      }
      return r;
    });
}
function busy(btn, on, label){ if (!btn) return; if (on){ btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + (label || '処理中…'); } else { btn.disabled = false; btn.innerHTML = btn.dataset.l || btn.innerHTML; } }
const userName = email => (S.users.find(u => u.email === email) || {}).name || email || '';
const yen = man => { const n = Number(String(man).replace(/[^\d.]/g, '')); if (!man || isNaN(n)) return '価格要確認'; return n >= 10000 ? (n / 10000).toFixed(2).replace(/\.?0+$/, '') + '億円' : n.toLocaleString() + '万円'; };
const specs = kind => S.specs[kind];
const missingReq = (kind, r) => specs(kind).some(s => s.req && (r[s.k] === '' || r[s.k] == null));

/* ===== ログイン ===== */
function showLogin(){
  $('#hdr').hidden = true;
  ls.set('sg_token', '');
  $('#app').innerHTML = `<div class="center"><img src="data:image/png;base64,${LOGO}" alt="sIgNaL"><h1>sIgNaL Match</h1>
    ${BOOT.loginUrl ? `<p class="sub">Googleアカウントで本人確認をしてから開きます。</p><a class="btn" href="${esc(BOOT.loginUrl)}" >Googleアカウントで開始</a><p class="sub">確認は30日ごとに1回です。</p>`
    : `<p class="sub">ログインの設定がまだ終わっていません。管理者に連絡してください。</p>`}</div>`;
}
function showNoUser(email){
  $('#hdr').hidden = true;
  $('#app').innerHTML = `<div class="center"><img src="data:image/png;base64,${LOGO}" alt="sIgNaL"><h1>利用者に登録されていません</h1>
    <p class="sub">このGoogleアカウント（${esc(email)}）は、まだ利用者に登録されていません。管理者にこのアカウントを伝えて、登録してもらってください。</p>
    ${BOOT.loginUrl ? `<a class="btn ghost" href="${esc(BOOT.loginUrl)}" >別のアカウントで開始</a>` : ''}</div>`;
}
$('#logout').onclick = () => { TOKEN = ''; showLogin(); };

/* ===== 起動 ===== */
function boot(){
  if (!TOKEN) { showLogin(); return; }
  api('init').then(d => {
    Object.assign(S, d);
    LOGO = d.logo || LOGO;
    $('#hdr').hidden = false;
    $('#meName').textContent = S.me.name + (S.me.admin ? '（管理者）' : '');
    const sl = $('#sheetLink'); if (S.sheetUrl) { sl.href = S.sheetUrl; sl.hidden = false; }
    xBadge();
    go(S.view === 'detail' ? 'list' : S.view);
  }).catch(e => { if (!/ログイン|登録されていません/.test(e.message)) $('#app').innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn" onclick="boot()">もう一度読み込む</button>`; });
}
function refresh(){ return api('init').then(d => { Object.assign(S, d); xBadge(); }); }
function xBadge(){ const b = $('#xb'); if (b) { b.textContent = S.xAsk || ''; b.hidden = !S.xAsk; } }
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
function go(view, opt){
  S.view = view; Object.assign(S, opt || {});
  document.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go === view || (view === 'detail' && b.dataset.go === (S.dkind === 'buyer' ? 'buyers' : 'list'))));
  ({ list: renderList, new: renderNew, buyers: renderBuyers, detail: renderDetail, xm: renderX })[view]();
  window.scrollTo(0, 0);
}

/* ===== 一覧 ===== */
function renderList(){
  const k = S.listKind;
  const rows = k === 'deal' ? S.deals : S.needs;

};

function fieldHtml(sp, p){
  const id = p + '-' + sp.k;
  const full = sp.full || sp.t === 'checks' || sp.t === 'textarea' || sp.t === 'check';
  const wrap = (inner, lab) => `<div class="f${full ? ' full' : ''}${sp.t === 'checks' ? ' grp' : ''}" data-k="${sp.k}">${lab === false ? '' : `<label for="${id}">${esc(sp.l)}</label>`}${inner}</div>`;
  switch (sp.t) {
    case 'select': return wrap(`<select id="${id}"><option value="">選択してください</option>${sp.o.map(o => `<option>${esc(o)}</option>`).join('')}</select>${sp.other ? `<input id="${id}-other" class="other" placeholder="商流を入力（例：売主→元付→A→B→sIgNaL）" hidden>` : ''}`);
    case 'user': return wrap(`<select id="${id}"><option value="">選択してください</option>${S.users.map(u => `<option value="${esc(u.email)}">${esc(u.name)}</option>`).join('')}</select>`);
    case 'checks': return `<div class="f full grp" data-k="${sp.k}"><span class="lbl">${esc(sp.l)}</span><div class="checks">${sp.o.map((o, i) => `<label><input type="checkbox" id="${id}-${i}" value="${esc(o)}">${esc(o)}</label>`).join('')}</div></div>`;
    case 'check': return `<div class="f full" data-k="${sp.k}"><label class="inline"><input type="checkbox" id="${id}">${esc(sp.l)}</label></div>`;
    case 'textarea': return wrap(`<textarea id="${id}" rows="3" placeholder="${esc(sp.ph || '')}"></textarea>`);
    default: return wrap(`<input id="${id}" ${sp.num ? 'inputmode="decimal"' : ''} placeholder="${esc(sp.ph || '')}">`);
  }
}
function getVal(sp, p){
  const id = p + '-' + sp.k, el = document.getElementById(id);
  if (sp.t === 'checks') return sp.o.filter((o, i) => document.getElementById(id + '-' + i).checked).join('、');
  if (sp.t === 'check') return el.checked ? 'はい' : '';
  if (sp.t === 'select' && sp.other && el.value === 'その他') return document.getElementById(id + '-other').value.trim();
  return el.value.trim();
}
function setVal(sp, p, v){
  const id = p + '-' + sp.k, el = document.getElementById(id);
  v = v == null ? '' : v;
  if (sp.t === 'checks') { const arr = Array.isArray(v) ? v : String(v).split(/[、,]/).map(x => x.trim()); sp.o.forEach((o, i) => document.getElementById(id + '-' + i).checked = arr.indexOf(o) >= 0); return true; }
  if (sp.t === 'check') { el.checked = v === 'はい' || v === true; return true; }
  if (sp.t === 'select' || sp.t === 'user') {
    const opts = [...el.options].map(o => o.value);
    if (v === '' || opts.indexOf(String(v)) >= 0) { el.value = v; if (sp.other) document.getElementById(id + '-other').hidden = true; return true; }
    if (sp.other) { el.value = 'その他'; const o = document.getElementById(id + '-other'); o.hidden = false; o.value = v; return true; }
    return false;
  }
  el.value = sp.num && v !== '' ? String(v).replace(/[^\d.]/g, '') : v;
  return true;
}
const isEmpty = (sp, p) => getVal(sp, p) === '';
function mark(sp, p, st){
  const f = document.querySelector(`#${p}-form [data-k="${sp.k}"]`); if (!f) return;
  f.classList.remove('auto', 'tbc'); if (st) f.classList.add(st);
}

    <div class="drop" id="${p}-drop"><label for="${p}-files">${t.drop}（PDF・画像）</label><input id="${p}-files" type="file" multiple accept=".pdf,image/*"><small>この枠にドラッグ、またはスクショを Ctrl+V で貼り付けもできます</small><div id="${p}-filelist" style="font-size:12.5px"></div></div>

   ${opt.readonly ? '<p class="note">この案件は担当者と管理者だけが編集できます。</p>' : `<div class="row" style="margin-top:16px"><button class="btn" id="${p}-save">${opt.edit ? '変更を保存' : t.save}</button><span class="sub" style="margin:0" id="${p}-savehint"></span></div>`}
  </div>`;
}
const KIND_LABEL = { deal: '売り情報', need: '買ニーズ', buyer: '取引先' };

function bindForm(kind, p, rec, opt){
  const sp = specs(kind);
  const st = { fileIds: [] };
  sp.forEach(s => {
    const v = rec ? rec[s.k] : (s.def || (s.t === 'user' && kind !== 'buyer' ? S.me.email : ''));
    setVal(s, p, v);
  });
  if (rec && det(sp).some(s => rec[s.k])) { const m = $('#' + p + '-more'); if (m) m.open = true; }
  if (opt.readonly) { document.querySelectorAll(`#${p}-form input,#${p}-form select,#${p}-form textarea`).forEach(e => e.disabled = true); return; }
  // 編集時は、空いている必須項目を赤枠で見せる
  if (rec) sp.forEach(s => { if (s.req && isEmpty(s, p)) mark(s, p, 'tbc'); });
  // 手で触ったらマークを消す
  document.querySelectorAll(`#${p}-form .f`).forEach(f => { const clr = () => f.classList.remove('auto', 'tbc'); f.addEventListener('input', clr); f.addEventListener('change', clr); });
  sp.filter(s => s.other).forEach(s => { const sel = $(`#${p}-${s.k}`); sel.addEventListener('change', () => { const o = $(`#${p}-${s.k}-other`); o.hidden = sel.value !== 'その他'; if (!o.hidden) o.focus(); }); });

  // 読み取り
  const fi = $(`#${p}-files`), readBtn = $(`#${p}-read`), drop = $(`#${p}-drop`);
  const run = async files => {
    const text = $(`#${p}-paste`).value.trim();
    if (!files.length && !text) { toast('資料を選ぶか、文面を貼り付けてください'); return; }
    busy(readBtn, true, '読み取り中…');
    try {
      const payload = await Promise.all(files.map(prepFile));
      const size = payload.reduce((n, f) => n + f.data.length, 0);
      if (size > 30e6) throw new Error('資料が大きすぎます（合計20MBほどまで）。ページ数を減らすか、何回かに分けて読み取ってください');
      const r = await api('extract', { kind, files: payload, text });
      st.fileIds = st.fileIds.concat(r.fileIds || []);
      applyRead(kind, p, r);
      toast('読み取りました。赤枠の項目を確認してください');
    } catch (e) { toast(e.message, 6000); }
    busy(readBtn, false);
  };
  const addFiles = list => {
    const files = [...list].filter(f => f.type === 'application/pdf' || /^image\//.test(f.type));
    const bad = files.filter(f => /heic|heif/i.test(f.type + f.name));
    if (bad.length) { toast('HEIC形式の写真は読み取れません。スクショか、JPEGで保存した写真を使ってください', 6000); }
    const ok = files.filter(f => bad.indexOf(f) < 0);
    if (!ok.length) return;
    const fl = $(`#${p}-filelist`); fl.textContent = (fl.textContent ? fl.textContent + '、' : '') + ok.map(f => f.name || '貼り付けた画像').join('、');
    run(ok);
  };
  fi.onchange = () => { addFiles(fi.files); fi.value = ''; };
  readBtn.onclick = () => run([]);
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
  PASTE_TARGET = list => addFiles(list);

  // 保存
  let confirmAt = 0;
  $(`#${p}-save`).onclick = async e => {
    const btn = e.currentTarget;
    const n = document.querySelectorAll(`#${p}-form .f.tbc`).length;
    if (n && Date.now() - confirmAt > 5000) { confirmAt = Date.now(); $(`#${p}-savehint`).textContent = `要確認の項目が${n}件あります。このまま保存する場合は、もう一度押してください（要確認のまま残ります）`; return; }
    const out = {}; sp.forEach(s => { out[s.k] = getVal(s, p); });
    if (rec) out.id = rec.id;
    busy(btn, true, '保存中…');
    try {
      const r = await api('saveRecord', { kind, rec: out, fileIds: st.fileIds });
      st.fileIds = [];
      await refresh();
      toast(rec ? '保存しました' : '登録しました');
      opt.onSaved && opt.onSaved(r.rec);
    } catch (err) { toast(err.message, 6000); busy(btn, false); }
  };
}
const det = sp => sp.filter(s => s.d);
let PASTE_TARGET = null;
document.addEventListener('paste', e => {
  if (!PASTE_TARGET || !e.clipboardData) return;
  const files = [...e.clipboardData.files].filter(f => /^image\//.test(f.type));
  if (files.length) { e.preventDefault(); PASTE_TARGET(files); }
});

function applyRead(kind, p, r){
  const sp = specs(kind);
  const check = r.check || [];
  let detailTouched = false;
  sp.forEach(s => {
    const v = r.fields[s.k];
    const has = v != null && v !== '' && !(Array.isArray(v) && !v.length);
    if (has && isEmpty(s, p)) {
      const ok = setVal(s, p, v);
      mark(s, p, ok ? (check.indexOf(s.k) >= 0 ? 'tbc' : 'auto') : 'tbc');
      if (s.d) detailTouched = true;
    } else if (has && check.indexOf(s.k) >= 0) mark(s, p, 'tbc');
    else if (s.req && isEmpty(s, p)) mark(s, p, 'tbc');
  });
  if (detailTouched) { const m = $('#' + p + '-more'); if (m) m.open = true; }
  $(`#${p}-note`).innerHTML = r.note ? `<p class="note">AIのメモ：${esc(r.note)}</p>` : '';
}

// 画像は長辺2000pxまで縮めて送る（通信量を減らす）
function prepFile(f){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onerror = () => rej(new Error('ファイルを読み込めませんでした：' + f.name));
    rd.onload = () => {
      const url = rd.result;
      if (f.type === 'application/pdf' || !/^image\/(jpeg|png|webp|gif)$/.test(f.type)) return res({ name: f.name || 'file.pdf', mimeType: f.type, data: url.split(',')[1] });
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, 2000 / Math.max(img.width, img.height));
        if (sc === 1 && f.size < 3e6) return res({ name: f.name || '貼り付けた画像.png', mimeType: f.type, data: url.split(',')[1] });
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res({ name: (f.name || '貼り付けた画像').replace(/\.\w+$/, '') + '.jpg', mimeType: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.88).split(',')[1] });
      };
      img.onerror = () => res({ name: f.name, mimeType: f.type, data: url.split(',')[1] });
      img.src = url;
    };
    rd.readAsDataURL(f);
  });
}

function saveFile(x){
  const bin = atob(x.data), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([buf], { type: x.mimeType || 'application/octet-stream' }));
  const a = document.createElement('a'); a.href = url; a.download = x.name || 'download'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function downloadFile(el, fileId){
  const label = el.textContent; el.textContent = 'ダウンロード準備中…'; el.style.pointerEvents = 'none';
  try { saveFile(await api('fileData', { kind: S.dkind, id: S.cur.rec.id, fileId: fileId || '' })); }
  catch (err) { toast(err.message, 6000); }
  el.textContent = label; el.style.pointerEvents = '';
}

  $('#dbody').innerHTML = `<p class="sub">条件や担当者を変更すると、前の内容がここに残ります。</p><div class="tbl-wrap"><table class="log"><tr><th>日時</th><th>項目</th><th>変更前</th><th>変更後</th><th>変更者</th></tr>
    ${d.history.length ? d.history.map(h => `<tr><td>${esc(h.at)}</td><td>${esc(h.field)}</td><td>${esc(h.before)}</td><td>${esc(h.after)}</td><td>${esc(h.by)}</td></tr>`).join('') : '<tr><td colspan="5" style="color:var(--muted)">まだ変更はありません</td></tr>'}</table></div>`;
}

let LOGO = BOOT.logo || '';
$('#logo').src = 'data:image/png;base64,' + LOGO;
boot();
