<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sIgNaL desk</title>
<meta name="apple-mobile-web-app-title" content="sIgNaL desk">
<meta name="application-name" content="sIgNaL desk">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b3864">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --navy:#2b3864; --teal:#367069; --green:#4d986b; --mint:#eaf2ef;
  --ink:#1b2328; --sub:#5b6870; --line:#dde3e6; --bg:#f4f6f7; --card:#fff;
  --warn:#b4541a; --hl:#fff4cf;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}
.hd{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:.02em}
.brand small{font-weight:400;font-size:11px;opacity:.7;letter-spacing:0}
.mode{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.mode button{border:0;background:transparent;color:#fff;padding:6px 18px;border-radius:999px;cursor:pointer;font-weight:700}
.mode button.on{background:#fff;color:var(--navy)}
.hd .sp{flex:1}
.hbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.1)}
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;background:#232f55}
nav.tabs button{border:0;background:transparent;color:#bcd0d6;padding:11px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
nav.tabs button.on{color:#fff;border-bottom-color:#7fd1b5}
main{max-width:1400px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:11px;font-weight:500;background:var(--mint);color:var(--teal);padding:2px 8px;border-radius:999px}
.drop{border:2px dashed #b9c7cc;border-radius:12px;padding:16px;text-align:center;color:var(--sub);cursor:pointer;background:#fafcfc}
.drop.on{border-color:var(--teal);background:var(--mint)}
.drop b{color:var(--teal)}
.prop-top{display:grid;grid-template-columns:280px 1fr;gap:16px}
.thumb{width:100%;border:1px solid var(--line);border-radius:8px;display:block;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11.5px;color:var(--sub)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;width:100%}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #9fd8c6;border-color:var(--teal)}
.f.wide{grid-column:1/-1}
.f .unit{font-size:11px;color:var(--sub)}
.f.chk{flex-direction:row;align-items:center;gap:8px;padding-top:16px}
.f.chk input{width:auto}
.f.auto input{background:#f7fbfa}
.f.touched input,.f.touched select{background:#fffdf3}
.two{display:grid;grid-template-columns:minmax(330px,440px) 1fr;gap:16px;align-items:start}
.panel{position:sticky;top:110px;max-height:calc(100vh - 124px);overflow:auto}
.btn{border:0;border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:700;background:var(--teal);color:#fff}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn.sm{padding:6px 10px;font-size:12.5px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--sub);font-size:12px}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.warn{color:var(--warn)}
.pv-wrap{background:#e6eaec;border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pv{position:relative;box-shadow:0 2px 14px rgba(0,0,0,.15);background:#fff;overflow:hidden}
.pv>.sheet{transform-origin:0 0;position:absolute;left:0;top:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16272f;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw}
#toast.show{opacity:1}
.status{font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--mint);color:var(--teal);margin-top:8px;display:none}
.status.show{display:block}
.status.err{background:#fdecea;color:#a1361b}
.links a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--ink);margin-bottom:6px;background:#fff}
.links a:hover{border-color:var(--teal)}
.links a span{color:var(--teal);font-size:12px}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.out{background:#f7f9fa;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;line-height:1.7;font-size:13px;min-height:44px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv b{text-align:right}
canvas.bandpv{max-width:100%;box-shadow:0 2px 14px rgba(0,0,0,.15);background:#fff}
.hide{display:none!important}
.pp{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pp button{border:2px solid var(--line);border-radius:6px;padding:0;background:#fff;cursor:pointer;width:62px;position:relative}
.pp button img{width:100%;display:block;border-radius:4px}
.pp button.on{border-color:var(--teal)}
.pp button span{position:absolute;left:2px;top:2px;background:var(--navy);color:#fff;font-size:10px;padding:0 5px;border-radius:4px}
.rate-list{display:flex;flex-direction:column;gap:6px}
.rate-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.rate-no{flex:0 0 28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.rate-main{flex:1;min-width:0}.rate-v{font-size:18px;font-weight:900;color:var(--teal)}
.rate-act{display:flex;gap:6px;flex-wrap:wrap}
#gate{position:fixed;inset:0;z-index:200;background:#f4f6f7;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .gate-in{max-width:420px;text-align:center}
#gate h1{color:var(--navy);margin:10px 0}
#gate p{color:var(--sub);line-height:1.8}
#gate .btn{display:inline-block;text-decoration:none;margin-top:8px}
.au-log{margin-top:10px;font-size:13px;line-height:1.8}
.au-log .ok{color:var(--teal)}.au-log .warn{color:#9a6b00}.au-log .err{color:#a1361b}
.card.ai-auto{border:2px solid #cfe3dc;background:linear-gradient(180deg,#f7fbfa,#fff)}
.collapse-btn{margin-left:auto;font-size:12px;border:0;background:none;color:var(--teal);cursor:pointer}
@media (max-width:900px){
  .prop-top,.two{grid-template-columns:1fr}
  .panel{position:static;max-height:none}
  main{padding:10px}
}

/* ===== A4 sheets ===== */
.sheet{width:794px;height:1123px;background:#fff;color:#111;font-family:"Noto Sans JP",sans-serif;padding:46px 54px;position:relative;font-size:12.5px;line-height:1.5}
.sheet *{box-sizing:border-box}
.sheet .mincho{font-family:"Noto Serif JP",serif}
.sheet h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.06em}
.sheet .yen{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.sheet .hl{background:var(--hl)}
.sheet .bx{border:1.5px solid #9aa4a8;padding:14px 18px;margin-top:14px}
.sheet table{border-collapse:collapse;width:100%}
.sheet .ft{position:absolute;left:54px;right:54px;bottom:34px;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid var(--teal);padding-top:8px;font-size:10.5px;color:#333}
.sheet .ft .co{font-weight:700;font-size:12.5px;color:var(--navy)}
.sheet .logo-img{height:46px}
.cost td{padding:3px 4px;vertical-align:middle}
.cost td.lbl{width:190px}
.cost td.dots{color:#888;letter-spacing:.2em;width:90px}
.cost td.yaku{width:26px;color:#555}
.cost td.amt{width:120px;text-align:right;font-weight:700;color:#c0301e;background:var(--hl);font-variant-numeric:tabular-nums}
.cost td.amt.k{color:#111}
.cost td.nt{font-size:10.5px;color:#444;padding-left:10px}
.sec-t{font-size:12px;color:#333;margin:10px 0 4px}
.sim{border:1.5px dashed #b5bdc0;padding:10px 14px;margin-top:12px}
.sim table td,.sim table th{padding:4px 6px;font-size:11.5px}
.sim th{background:#eef1f2;font-weight:500}
.ptitle{display:inline-block;background:var(--hl);padding:3px 10px;font-weight:700}
.doc-tbl{width:100%;border-collapse:collapse}
.doc-tbl th,.doc-tbl td{border:1px solid #8e989c;padding:7px 10px;font-size:12.5px;text-align:left;vertical-align:top}
.doc-tbl th{background:#eef3f2;width:150px;font-weight:500;white-space:nowrap}
.seal{display:inline-block;width:54px;height:54px;border:1px solid #999;border-radius:50%;text-align:center;line-height:54px;color:#aaa;font-size:11px}


/* 査定書 */
.sa{padding:0 46px}
.sa-ph{padding:26px 0 12px;border-bottom:1px solid #e3e9ea;margin-bottom:14px}
.sa-ph h2{margin:2px 0 0;font-size:22px;color:#2b3864;letter-spacing:.06em}
.sa-ft{position:absolute;left:46px;right:46px;bottom:26px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #dfe7e8;padding-top:8px;font-size:10px;color:#55636a}
.sa-ft b{color:#2b3864;font-size:11px}
.sa-lead{font-size:12.5px;line-height:1.95;margin:6px 0 0}
.sa-steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.sa-step{display:flex;gap:12px;background:#f5f8f8;border-radius:12px;padding:14px}
.sa-step p{margin:4px 0 0;font-size:11px;line-height:1.7;color:#445}
.sa-step b{color:#2b3864;font-size:13.5px}
.sa-sn{flex:0 0 30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2b3864,#367069);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.sa-mini{width:100%;border-collapse:collapse;font-size:11.5px}
.sa-mini td{padding:7px 4px;border-bottom:1px dashed #e3e9ea}
.sa-mini td:first-child{width:130px;color:#2b3864;font-weight:700}
.sa-spec{border-collapse:collapse;font-size:12.5px}
.sa-spec th{width:130px;text-align:left;color:#6b7a80;font-weight:500;padding:9px 10px;border-bottom:1px solid #e3e9ea;background:#f5f8f8}
.sa-spec td{padding:9px 12px;border-bottom:1px solid #e3e9ea}
.sa-tbl{width:100%;border-collapse:collapse;font-size:10.5px}
.sa-tbl th{background:#2b3864;color:#fff;font-weight:500;padding:6px 4px;font-size:10px;line-height:1.3}
.sa-tbl th .sa-sub{color:#cdd6e8}
.sa-tbl td{padding:6px 4px;border-bottom:1px solid #e3e9ea;text-align:center;vertical-align:middle}
.sa-tbl tr:nth-child(odd) td{background:#f8fafa}
.sa-tbl td.r{text-align:right;white-space:nowrap}
.sa-tbl td.up{color:#367069}.sa-tbl td.dn{color:#b4541a}
.sa-med td{font-size:11.5px;padding:10px 6px}.sa-med td:first-child{text-align:left;font-weight:700;color:#2b3864;width:170px}
.sa-sub{font-size:9px;color:#7a878c}
.sa-tag{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:999px;border:1px solid #367069;color:#367069}
.sa-tag.sold{background:#2b3864;border-color:#2b3864;color:#fff}
.sa-note{font-size:9.5px;color:#6b7a80;margin-top:8px}
.sa-calc{display:flex;align-items:center;gap:10px;margin-top:16px;background:#f5f8f8;border-radius:12px;padding:14px}
.sa-calc>div{flex:1;text-align:center}.sa-calc span{display:block;font-size:10px;color:#6b7a80}
.sa-calc b{font-size:19px;color:#2b3864;font-variant-numeric:tabular-nums}.sa-calc small{font-size:10px;margin-left:2px}
.sa-calc .op{flex:0 0 auto;font-size:18px;color:#6b7a80}
.sa-calc .acc{background:linear-gradient(135deg,#2b3864,#367069);border-radius:10px;padding:8px}
.sa-calc .acc span,.sa-calc .acc b{color:#fff}
.sa-sec{margin:18px 0 8px;font-weight:700;color:#2b3864;font-size:13px}
.sa-plans{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end}
.sa-plan{border:1px solid #dfe7e8;border-radius:14px;padding:14px;text-align:center}
.sa-plan.main{border:0;background:linear-gradient(160deg,#2b3864,#367069 70%,#4d986b);color:#fff;padding:20px 14px}
.sa-pn{font-weight:900;font-size:13px;color:#2b3864}.sa-plan.main .sa-pn{color:#fff;font-size:15px}
.sa-ps{font-size:9.5px;color:#6b7a80;margin-top:2px}.sa-plan.main .sa-ps{color:#d6e6e0}
.sa-pv{font-size:26px;font-weight:900;color:#2b3864;margin-top:8px;font-variant-numeric:tabular-nums}.sa-plan.main .sa-pv{color:#fff;font-size:32px}
.sa-pv small{font-size:12px;margin-left:3px}
.sa-pt{font-size:10px;color:#6b7a80;margin-top:2px}.sa-plan.main .sa-pt{color:#d6e6e0}
.sa-cover{padding:0}
.sa-cv-side{position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(180deg,#2b3864,#367069 60%,#5fa877)}
.sa-cv-main{position:absolute;left:96px;right:70px;top:150px}
.sa-cv-cust{font-size:24px;font-weight:700;color:#2b3864;margin-top:26px;border-bottom:2px solid #2b3864;display:inline-block;padding:0 8px 4px 0;min-width:280px}
.sa-cv-cust small{font-size:14px;margin-left:10px}
.sa-cv-title{font-size:44px;line-height:1.35;color:#2b3864;letter-spacing:.1em;margin-top:60px}
.sa-cv-line{width:80px;height:4px;background:linear-gradient(90deg,#2b3864,#5fa877);margin:28px 0}
.sa-cv-name{font-size:22px;font-weight:700;color:#1b2328}
.sa-cv-addr{font-size:13px;color:#55636a;margin-top:6px}
.sa-cv-date{font-size:13px;color:#367069;margin-top:26px;font-weight:700}
.sa-cv-foot{position:absolute;left:96px;right:70px;bottom:80px;display:flex;align-items:flex-end;gap:28px;border-top:1px solid #dfe7e8;padding-top:22px}
/* 査定 入力テーブル */
.sa-edit{border-collapse:collapse;font-size:12px;min-width:100%}
.sa-edit th{background:#f1f4f5;font-weight:500;color:var(--sub);padding:6px 4px;white-space:nowrap;font-size:11px}
.sa-edit td{padding:3px 3px;border-bottom:1px solid var(--line);white-space:nowrap}
.sa-edit td.r{text-align:right;padding:0 6px}
.sa-edit input,.sa-edit select{border:1px solid var(--line);border-radius:5px;padding:4px 5px;font-size:12px;background:#fff}
.sa-edit tr.off td{opacity:.45}
.xbtn{border:0;background:none;color:#a1361b;font-size:16px;cursor:pointer}

.sheet .ln-tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:10.5px}
.sheet .ln-tbl th{background:#2b3864;color:#fff;font-weight:500;padding:5px 4px;font-size:10px}
.sheet .ln-tbl td{padding:3.2px 5px;border-bottom:1px solid #eef2f2;text-align:center;font-variant-numeric:tabular-nums}
.sheet .ln-tbl td.r{text-align:right}.sheet .ln-tbl td.b{font-weight:700;color:#2b3864}
.sheet .ln-tbl tr.q td{background:#f1f6f4;border-bottom:1px solid #cfe0da}
.sheet .ln-tbl.sm td{padding:1px 5px;font-size:9.5px;line-height:1.45}
.sheet .ln-tbl.sm .ln-bar{height:6px}
.sheet.rv{font-size:11px}
.rv-m{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.rv-mc{border:1px solid #dfe7e8;border-top:4px solid;border-radius:10px;padding:8px 11px}
.rv-mc.acc{background:#eaf2ef}
.rv-mt{font-size:11px;font-weight:700;color:#2b3864;display:flex;align-items:center;gap:6px}
.rv-mt i,.rv-bl i,.rv-lg i{display:inline-block;width:9px;height:9px;border-radius:3px}
.rv-mv{font-size:21px;font-weight:900;color:#1d2a4d;margin-top:2px;font-variant-numeric:tabular-nums}.rv-mv small{font-size:10px;font-weight:500;margin-left:2px}
.rv-mc.acc .rv-mv{color:#367069}
.rv-ms{font-size:8.8px;color:#5b6870;line-height:1.55;margin-top:3px;border-top:1px dashed #dfe7e8;padding-top:3px}
.rv-mk{font-size:9px;color:#4a585e;margin-top:3px;line-height:1.45}
.rv-hl{margin-top:10px;background:linear-gradient(90deg,#2b3864,#367069);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rv-hl b{font-size:17px;color:#fff}.rv-hl span{font-size:11px;opacity:.9}
.rv-sec{font-size:12px;font-weight:700;color:#2b3864;margin-top:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.rv-sec small{font-weight:500;color:#6b7a80;font-size:9.5px}
.rv-lg{display:flex;gap:12px;font-size:9.5px;font-weight:500;color:#4a585e;margin-left:auto}.rv-lg span{display:flex;align-items:center;gap:4px}.rv-lg i{height:3px;width:16px;border-radius:2px}.rv-lg i.d{background:none;border-top:2px dashed;height:0}
.rv-bar{display:grid;grid-template-columns:110px 1fr 92px;grid-template-rows:auto auto;column-gap:10px;align-items:center;margin-top:6px}
.rv-bl{font-size:11px;font-weight:700;color:#2b3864;display:flex;align-items:center;gap:6px}
.rv-bt{background:#f1f4f5;border-radius:6px;height:16px;overflow:hidden}.rv-bt div{height:100%;border-radius:6px}
.rv-bv{font-size:16px;font-weight:900;text-align:right;color:#4a585e;font-variant-numeric:tabular-nums}.rv-bv small{font-size:9px;font-weight:500;margin-left:2px}.rv-bv.best{color:#367069}
.rv-bs{grid-column:2/4;font-size:9px;color:#6b7a80}
.rv-cols{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;align-items:start}
.sheet .rv-t{margin-top:4px}.sheet .rv-t td{padding:2px 5px;font-size:10px}
.rv-box{border:1px solid #dfe7e8;border-radius:10px;padding:7px 10px;margin-top:4px}.rv-box+.rv-box{margin-top:7px}
.rv-bh{font-size:10.5px;font-weight:700;color:#367069;margin-bottom:3px}
.rv-sn{display:flex;justify-content:space-between;font-size:9.8px;padding:1.5px 0;border-bottom:1px dashed #eef2f2}
.rv-pt{font-size:9.6px;line-height:1.55;color:#33424a}
.rv-ov{position:fixed;inset:0;z-index:9999;background:rgba(20,28,48,.82);overflow:auto;padding:12px;display:flex;justify-content:center;align-items:flex-start}
.rv-ovin{position:relative;flex:none;overflow:hidden}.rv-ovin .sheet{box-shadow:0 10px 40px rgba(0,0,0,.35)}
.rv-x{position:fixed;top:10px;right:14px;z-index:10000;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#2b3864;font-size:26px;line-height:44px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.tool-nav{position:sticky;top:0;z-index:30;background:var(--bg,#f4f6f7);padding:8px 0 10px;margin-bottom:6px}

const comma=n=>Math.round(n).toLocaleString("ja-JP");

  m=num(m); if(!m) return "";

function staff(i){ const L=staffList(); return L[i??SET.staffIdx]||L[0]||{name:"",title:"",mobile:"",mail:"",last:""}; }

let logoImgCache=null, logoImgSrc=null;
function getLogoImage(){ return new Promise(res=>{
  const src=SET.logo||LOGO_MARK;
  if(logoImgCache&&logoImgSrc===src) return res(logoImgCache);
  const im=new Image(); im.onload=()=>{logoImgCache=im;logoImgSrc=src;res(im)}; im.onerror=()=>res(null); im.src=src; });
}

function fieldHTML(f,val,ctx){
  if(f.type==="sec") return `<div class="f wide fsec">${esc(f.label)}</div>`;
  const id=`${ctx}__${f.k}`;
  const cls=["f"]; if(f.wide)cls.push("wide"); if(f.type==="check")cls.push("chk");
  if(ctx!=="P"){ cls.push(st.touched[ctx+"."+f.k]?"touched":"auto"); }
  const lab=`${esc(f.label)}${f.unit?` <span class="unit">(${esc(f.unit)})</span>`:""}`;
  let inp;
  if(f.type==="select") inp=`<select id="${id}" data-k="${f.k}">${f.opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(val)===String(v)?"selected":""}>${esc(t||"—")}</option>`}).join("")}</select>`;
  else if(f.type==="textarea") inp=`<textarea id="${id}" data-k="${f.k}" placeholder="${esc(f.ph||"")}">${esc(val)}</textarea>`;
  else if(f.type==="check") return `<div class="${cls.join(" ")}"><input type="checkbox" id="${id}" data-k="${f.k}" ${val?"checked":""}><label for="${id}" style="font-size:13px;color:var(--ink)">${lab}</label></div>`;
  else inp=`<input id="${id}" data-k="${f.k}" type="${f.type==="date"?"date":f.type==="time"?"time":"text"}" ${f.type==="number"?'inputmode="decimal"':""} value="${esc(val)}" placeholder="${esc(f.ph||"")}">`;
  return `<div class="${cls.join(" ")}"><label for="${id}">${lab}</label>${inp}${f.hint?`<span class="unit">${esc(f.hint)}</span>`:""}</div>`;
}
function readInput(el){ return el.type==="checkbox"?el.checked:el.value; }

function renderPropForm(){
  $("#propForm").innerHTML=propFields().map(f=>fieldHTML(f,st.P[f.k]??"","P")).join("");
  $$("#propForm [data-k]").forEach(el=>el.addEventListener("input",()=>{ st.P[el.dataset.k]=readInput(el); onDataChange(); }));
  if(typeof paintPropSum==="function"&&$("#propSum")) try{paintPropSum()}catch(e){}
}

/* ================= tabs ================= */
const TABS={
  sale:[["band","帯替え図面"],["plan","資金計画書"],["satei","査定書"],["hazard","ハザードマップ"],["naiken","内見依頼書"],["kaitsuke","買付証明書"],["tools","便利ツール"],["settings","設定"]],

};
function renderTabs(){
  const T=TABS[st.mode]; if(!T.find(t=>t[0]===st.tab)) st.tab=T[0][0];
  $("#tabs").innerHTML=T.map(([k,t])=>`<button data-t="${k}" class="${k===st.tab?"on":""}">${t}</button>`).join("");
  $$("#tabs button").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;renderTabs();renderView();});
  $("#modeTag").textContent=st.mode==="sale"?"売買":"賃貸";
  $$("#modeSw button").forEach(b=>b.classList.toggle("on",b.dataset.m===st.mode));
}
$$("#modeSw button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function setMode(m){ st.mode=m; renderTabs(); renderPropForm(); renderView(); }
const isMobile=()=>window.matchMedia("(max-width:700px)").matches;
st.propOpen=!isMobile();
function applyPropOpen(){ $("#propFormWrap").classList.toggle("hide",!st.propOpen); $("#propToggle").textContent=st.propOpen?"物件情報を閉じる ▲":"物件情報を編集 ▼"; paintPropSum(); }
function paintPropSum(){ const b=$("#propSum"); if(!b) return; const P=st.P;
  const items=[P.name,P.address,st.mode==="sale"?(P.price&&manYen(P.price)):(P.rent&&`賃料 ${comma(num(P.rent))}円`),P.motoCompany&&`元付：${P.motoCompany}`].filter(Boolean);
  b.innerHTML=!st.propOpen?(items.length?items.map(x=>`<span>${esc(x)}</span>`).join(""):`<span class="muted">物件情報は未入力です（マイソクを読み込むか「物件情報を編集」から入力）</span>`):""; }
$("#propToggle").onclick=()=>{ st.propOpen=!st.propOpen; applyPropOpen(); };
$("#newBtn").onclick=()=>{ st.P={}; st.docs={}; st.touched={}; st.pages=[]; st.sel=0; st.file=null; st.fileName=""; st.hazImg=null;
  $("#thumb").classList.add("hide"); $("#pagePick").innerHTML=""; $("#fileName").textContent=""; $("#reread").disabled=true; setStatus("");
  renderPropForm(); renderView(); toast("新しい物件を開始しました"); };

// 売買契約書印紙（軽減措置 〜2027/3/31）
function stampSale(y){ if(y<10000)return 0; if(y<=100000)return 200; if(y<=500000)return 200; if(y<=1e6)return 500; if(y<=5e6)return 1000; if(y<=1e7)return 5000; if(y<=5e7)return 10000; if(y<=1e8)return 30000; if(y<=5e8)return 60000; if(y<=1e9)return 160000; if(y<=5e9)return 320000; return 480000; }
// 金銭消費貸借契約書印紙（第1号の3）
function stampLoan(y){ if(y<10000)return 0; if(y<=1e5)return 200; if(y<=5e5)return 400; if(y<=1e6)return 1000; if(y<=5e6)return 2000; if(y<=1e7)return 10000; if(y<=5e7)return 20000; if(y<=1e8)return 60000; if(y<=5e8)return 100000; if(y<=1e9)return 200000; if(y<=5e9)return 400000; return 600000; }
// 売買仲介手数料（税抜上限）
function brokerageBase(y,akiya){ let b; if(y<=2e6)b=y*0.05; else if(y<=4e6)b=y*0.04+2e4; else b=y*0.03+6e4; if(akiya&&y<=8e6) b=Math.max(b,300000); return b; }
function monthly(P,ratePct,years){ const n=years*12; if(!P||!n) return 0; const r=ratePct/100/12; if(!r) return P/n; return P*r/(1-Math.pow(1+r,-n)); }
function principalFromMonthly(M,ratePct,years){ const n=years*12, r=ratePct/100/12; if(!r) return M*n; return M*(1-Math.pow(1+r,-n))/r; }

const isNew=()=>/新築/.test(st.P.kind||"");
const isMansion=()=>/マンション|区分/.test(st.P.kind||"");
const staffOpts=()=>staffList().map((s,i)=>[String(i),s.name]);
const DOCS={};
const planPrice=()=>st.touched["plan.price"]?num((st.docs.plan||{}).price):num(st.P.price);

/* ---- 資金計画書 ---- */
DOCS.plan={ title:"資金計画書", file:()=>`資金計画書_${st.P.name||"物件"}.pdf`,
  fields:()=>[
    {k:"cust",label:"お客様名",def:""},
    {k:"stage",label:"区分",type:"select",opts:["契約時","検討時","申込時"],def:"検討時"},
    {k:"date",label:"作成日",type:"date",def:today()},
    {k:"staff",label:"担当",type:"select",opts:staffOpts(),def:String(SET.staffIdx)},
    {k:"price",label:"物件価格",unit:"万円",type:"number",def:()=>st.P.price||""},
    {k:"stamp",label:"売買契約書印紙",unit:"円",type:"number",def:()=>stampSale(planPrice()*1e4),hint:"軽減税率（〜2027/3/31）で自動"},
    {k:"regist",label:"登記費用（保存・移転・抵当権）",unit:"円",type:"number",def:()=>Math.round(planPrice()*1e4*0.009/1e4)*1e4,hint:"概算：価格×0.9%。司法書士見積で上書き"},
    {k:"hyoji",label:"表示登記費用",unit:"円",type:"number",def:()=>isNew()?100000:0},
    {k:"kotei",label:"固定資産税等清算金",unit:"円",type:"number",def:()=>Math.round(planPrice()*1e4*0.003/1e4)*1e4,hint:"概算：価格×0.3%"},
    {k:"kanri",label:"管理費等清算金",unit:"円",type:"number",def:()=>num(st.P.mgmtFee)+num(st.P.repairFund)},
    {k:"akiya",label:"低廉な空家等の特例を適用（800万円以下）",type:"check",def:false},
    {k:"chukai",label:"仲介手数料（税込）",unit:"円",type:"number",def:()=>Math.round(brokerageBase(planPrice()*1e4,false)*1.1),hint:"（価格×3%＋6万円）×1.1 で自動"},
    {k:"otherName",label:"その他費用 名称",def:""},
    {k:"otherAmt",label:"その他費用",unit:"円",type:"number",def:0},
    {k:"tetsuke",label:"手付金",unit:"万円",type:"number",def:()=>planPrice()?Math.max(10,Math.round(planPrice()*0.05/10)*10):0,hint:"既定：価格の5%（10万円単位）"},
    {k:"useLoan",label:"住宅ローンを利用する",type:"check",def:true},
    {k:"down",label:"自己資金（頭金）",unit:"万円",type:"number",def:0},
    {k:"loan",label:"借入額",unit:"万円",type:"number",def:"",ph:"空欄＝価格＋諸費用−頭金（10万円単位）"},
    {k:"loanJimu",label:"ローン事務手数料",unit:"円",type:"number",def:33000},
    {k:"yushiPct",label:"融資事務手数料率",unit:"%",type:"number",def:2.2},
    {k:"kasai",label:"火災保険料",unit:"円",type:"number",def:()=>isMansion()?150000:300000},
    {k:"bank1",label:"パターン① 金融機関",def:"○○銀行"},
    {k:"rate1",label:"パターン① 金利",unit:"%",type:"number",def:0.635},
    {k:"bank2",label:"パターン② 金融機関",def:"○○銀行"},
    {k:"rate2",label:"パターン② 金利",unit:"%",type:"number",def:0.775},
    {k:"terms",label:"返済期間（カンマ区切り）",def:"35,40",unit:"年"},
    {k:"rateMonth",label:"金利の適用月",def:()=>`${new Date().getMonth()+1}月度`},
  ],
  calc(v){
    const price=num(v.price)*1e4; const T=k=>st.touched["plan."+k];
    if(!T("stamp")) v.stamp=stampSale(price);
    if(!T("regist")) v.regist=Math.round(price*0.009/1e4)*1e4;
    if(!T("kotei")) v.kotei=Math.round(price*0.003/1e4)*1e4;
    if(!T("chukai")) v.chukai=Math.round(brokerageBase(price,false)*1.1);
    const chukai=v.akiya? Math.round(brokerageBase(price,true)*1.1) : num(v.chukai);
    const contract=[
      ["売買契約書印紙",num(v.stamp),"（ご契約時にご用意頂きます）"],
      ["登記費用",num(v.regist),"（所有権保存・移転・抵当権設定等）"],
      ...(num(v.hyoji)?[["表示登記費用",num(v.hyoji),"（表題部登記申請費用）"]]:[]),
      ["固定資産税等清算金",num(v.kotei),"（引渡し日で日割清算）"],
      ...(num(v.kanri)||isMansion()?[["管理費等清算金",num(v.kanri),"（1ヶ月分を引渡し日で日割清算）"]]:[]),
      ["仲介手数料",chukai, v.akiya&&price<=8e6?"（低廉な空家等の特例 上限33万円）":"（売買代金×3%＋6万円）×1.1"],
      ...(v.otherName&&num(v.otherAmt)?[[v.otherName,num(v.otherAmt),""]]:[]),
    ];
    const cSum=contract.reduce((a,r)=>a+r[1],0);
    let loanY=0, loanRows=[];
    if(v.useLoan){
      const fixed=num(v.loanJimu)+num(v.kasai);
      const fees=L=>stampLoan(L)+L*num(v.yushiPct)/100+fixed;
      if(num(v.loan)) loanY=num(v.loan)*1e4;
      else { let L=price; for(let i=0;i<5;i++){ L=Math.max(0,Math.ceil((price+cSum+fees(L)-num(v.down)*1e4)/1e5)*1e5); } loanY=L; }
      loanRows=[
        ["ローン事務手数料",num(v.loanJimu),"（お借入れ1本につき）"],
        ["金消契約印紙",stampLoan(loanY),"（お借入れ方法により別途印紙代発生）"],
        ["融資事務手数料",Math.round(loanY*num(v.yushiPct)/100),`（融資金額×${num(v.yushiPct)}%）`],
        ["火災保険料",num(v.kasai),"（長期一括払い・火災・家財・地震保険等）"],
      ];
    } else {
      loanRows=[["火災保険料",num(v.kasai),"（長期一括払い・火災・家財・地震保険等）"]];
    }
    const lSum=loanRows.reduce((a,r)=>a+r[1],0);
    return {price,contract,loanRows,total:cSum+lSum,loanY};
  },
  render(v){
    const c=this.calc(v), s=staff(num(v.staff));
    const terms=String(v.terms||"35").split(/[,，\s]+/).map(Number).filter(Boolean).slice(0,3);
    const mg=num(st.P.mgmtFee)+num(st.P.repairFund);
    const sumC=c.contract.reduce((a,r)=>a+r[1],0), sumL=c.loanRows.reduce((a,r)=>a+r[1],0);
    const grand=c.price+c.total, down=v.useLoan?Math.max(0,grand-c.loanY):grand;
    const m1=v.useLoan&&terms.length?Math.floor(monthly(c.loanY,num(v.rate1),Math.max(...terms))):0;
    const list=(rows)=>rows.map(r=>`<div class="pl-row"><div><div class="pl-l">${esc(r[0])}</div>${r[2]?`<div class="pl-n">${esc(r[2].replace(/^（|）$/g,""))}</div>`:""}</div><div class="pl-a">${yen(r[1])}</div></div>`).join("");
    const kpi=(lab,val,unit,acc)=>`<div class="pl-kpi ${acc?"acc":""}"><div class="pl-kl">${lab}</div><div class="pl-kv">${val}<small>${unit||""}</small></div></div>`;
    const pct=x=>grand?Math.max(0,Math.min(100,x/grand*100)):0;
    const pat=(no,bank,rate,col)=>`<div class="pl-pat">
        <div class="pl-pat-h" style="background:${col}"><span>PLAN ${no}</span><b>${esc(bank)}</b><em>${num(rate)}%</em></div>
        <table class="pl-sim"><tr><th>返済期間</th><th>月々の返済額</th><th>${mg?"管理費等込":"年間返済額"}</th></tr>
        ${terms.map(t=>{const m=Math.floor(monthly(c.loanY,num(rate),t));return `<tr><td>${t}年</td><td class="pl-m">${yen(m)}</td><td>${mg?yen(m+mg):yen(m*12)}</td></tr>`}).join("")}
        </table></div>`;
    return `<div class="sheet pl">
      <div class="pl-top"></div>
      <div class="pl-head">
        <div><div class="pl-eyebrow">FUNDING PLAN</div><h1>資金計画書 <span class="pl-chip">${esc(v.stage)}</span></h1></div>
        <div style="text-align:right"><div class="pl-cust">${esc(v.cust||"　　　　")}<small>様</small></div><div class="pl-date">作成日 ${jDate(v.date)}</div></div>
      </div>
      <div class="pl-prop">
        <div style="flex:1;min-width:0"><div class="pl-kl">物件名</div><div class="pl-pn">${esc(st.P.name||"")}</div>
          <div class="pl-pa">${esc([st.P.address,st.P.layout,st.P.bldgArea].filter(Boolean).join("　｜　"))}</div></div>
        <div class="pl-price"><div class="pl-kl" style="color:#d6e6e0">物件価格</div><div>${comma(num(v.price))}<small>万円</small></div></div>
      </div>
      <div class="pl-kpis">
        ${kpi("諸費用合計（概算）",comma(c.total),"円")}
        ${kpi("総額（価格＋諸費用）",comma(grand),"円")}
        ${v.useLoan?kpi("お借入額",comma(c.loanY/1e4),"万円"):kpi("自己資金",comma(grand),"円")}
        ${v.useLoan?kpi(`月々のお支払い目安（PLAN①・${Math.max(...terms)}年）`,comma(m1+mg),"円",true):""}
      </div>
      ${v.useLoan?`<div class="pl-bar-w"><div class="pl-bar"><div style="width:${pct(c.loanY)}%;background:linear-gradient(90deg,#2b3864,#367069)"></div><div style="width:${pct(down)}%;background:#5fa877"></div></div>
        <div class="pl-legend"><span><i style="background:#367069"></i>お借入 ${yen(c.loanY)}</span><span><i style="background:#5fa877"></i>自己資金 ${yen(down)}</span></div></div>`:""}
      <div class="pl-cols">
        <div class="pl-box"><div class="pl-bh"><span>契約関係諸費用</span><b>${yen(sumC)}</b></div>${list(c.contract)}</div>
        <div class="pl-box"><div class="pl-bh"><span>${v.useLoan?"ローン関係費用":"その他費用"}</span><b>${yen(sumL)}</b></div>${list(c.loanRows)}
          <div class="pl-total"><span>諸費用合計</span><b>${yen(c.total)}</b></div></div>
      </div>
      ${v.useLoan?`<div class="pl-sec"><span>LOAN SIMULATION</span>ローンシミュレーション</div>
      <div class="pl-pats">${pat("①",v.bank1,v.rate1,"linear-gradient(90deg,#2b3864,#367069)")}${pat("②",v.bank2,v.rate2,"linear-gradient(90deg,#367069,#4d986b)")}</div>`:""}
      ${(()=>{const get=n=>(c.contract.concat(c.loanRows).find(r=>r[0]===n)||[0,0])[1];
        const tk=num(v.tetsuke)*1e4, atC=tk+get("売買契約書印紙"), atK=v.useLoan?get("金消契約印紙"):0;
        const atS=grand-atC-atK;
        const step=(no,t,amt,desc)=>`<div class="pl-step"><div class="pl-sn">${no}</div><div class="pl-st">${t}</div><div class="pl-sa">${yen(amt)}</div><div class="pl-sd">${desc}</div></div>`;
        return `<div class="pl-sec"><span>PAYMENT SCHEDULE</span>お支払いのタイミング（目安）</div><div class="pl-steps">
          ${step("1","売買契約時",atC,`手付金 ${yen(tk)}＋契約書印紙`)}
          ${v.useLoan?step("2","金銭消費貸借契約時",atK,"金消契約印紙"):""}
          ${step(v.useLoan?"3":"2","決済・お引渡し時",atS,v.useLoan?`残代金（お借入 ${yen(c.loanY)} 充当）・登記費用・清算金・仲介手数料・融資関係費用等`:"残代金・登記費用・清算金・仲介手数料等")}
        </div>`})()}
      <div class="pl-note">※諸費用は概算です。引越し費用・家具代等は含みません。※金利は${esc(v.rateMonth)}の参考値で、審査結果によりご利用いただけない場合があります。元利均等・ボーナス払いなしで試算しています。${mg?`※管理費等（月${comma(mg)}円）を含めた金額も記載しています。`:""}</div>
      ${footer(s)}
    </div>`;
  }
};

DOCS.init={ title:"初期費用計算書", file:()=>`初期費用計算書_${st.P.name||"物件"}.pdf`,
  fields:()=>[
    {k:"cust",label:"お客様名",def:""},
    {k:"date",label:"作成日",type:"date",def:today()},
    {k:"staff",label:"担当",type:"select",opts:staffOpts(),def:String(SET.staffIdx)},
    {k:"moveIn",label:"契約開始（入居）日",type:"date",def:()=>addDays(today(),14)},
    {k:"rent",label:"賃料",unit:"円",type:"number",def:()=>st.P.rent||""},
    {k:"common",label:"管理費・共益費",unit:"円",type:"number",def:()=>st.P.commonFee||0},
    {k:"deposit",label:"敷金",unit:"ヶ月",type:"number",def:()=>st.P.deposit||0},
    {k:"keyMoney",label:"礼金",unit:"ヶ月",type:"number",def:()=>st.P.keyMoney||0},
    {k:"nextMonth",label:"翌月分の前家賃を含める",type:"check",def:true},
    {k:"brokerM",label:"仲介手数料",unit:"ヶ月（税別）",type:"number",def:1},
    {k:"guarPct",label:"保証会社 初回保証料",unit:"％（月額総賃料に対し）",type:"number",def:50},
    {k:"insurance",label:"火災保険料",unit:"円",type:"number",def:()=>st.P.rentInsurance||20000},
    {k:"keyChange",label:"鍵交換費",unit:"円",type:"number",def:()=>st.P.keyChange||22000},
    {k:"other1n",label:"その他① 名称",def:()=>num(st.P.rentOther)?"その他初期費用":"室内消毒・抗菌"},
    {k:"other1",label:"その他①",unit:"円",type:"number",def:()=>num(st.P.rentOther)||0},
    {k:"other2n",label:"その他② 名称",def:""},
    {k:"other2",label:"その他②",unit:"円",type:"number",def:0},
    {k:"freeRent",label:"フリーレント",unit:"ヶ月",type:"number",def:0},
    {k:"memo",label:"備考",type:"textarea",def:"※金額は概算です。貸主・管理会社の条件により変動する場合があります。"},
  ],
  calc(v){
    const rent=num(v.rent), cm=num(v.common), m=rent+cm;
    let rows=[]; let prorate=0, days=0, dim=30, md="";
    if(v.moveIn){ const d=new Date(v.moveIn+"T00:00:00"); if(!isNaN(d)){ dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); days=dim-d.getDate()+1; prorate=Math.round(m*days/dim); md=`${d.getMonth()+1}/${d.getDate()}〜${d.getMonth()+1}/${dim}`; } }
    const fr=num(v.freeRent);
    rows.push(["敷金",rent*num(v.deposit),`賃料×${num(v.deposit)}ヶ月（退去時に精算）`,"dep"]);
    rows.push(["礼金",Math.round(rent*num(v.keyMoney)),`賃料×${num(v.keyMoney)}ヶ月`,"fee"]);
    rows.push(["日割家賃・管理費",fr?0:prorate, md?`${md}（${days}日分）`:"","rent"]);
    if(v.nextMonth) rows.push(["翌月分家賃・管理費",fr>=1?0:m,"前家賃1ヶ月分","rent"]);
    rows.push(["仲介手数料",Math.round(rent*num(v.brokerM)*1.1),`賃料×${num(v.brokerM)}ヶ月＋消費税`,"fee"]);
    rows.push(["保証会社 初回保証料",Math.round(m*num(v.guarPct)/100),`月額総賃料×${num(v.guarPct)}%`+(st.P.guarantee?`（${st.P.guarantee}）`:""),"etc"]);
    rows.push(["火災保険料",num(v.insurance),"2年契約目安","etc"]);
    rows.push(["鍵交換費",num(v.keyChange),"","etc"]);
    if(v.other1n&&num(v.other1)) rows.push([v.other1n,num(v.other1),"","etc"]);
    if(v.other2n&&num(v.other2)) rows.push([v.other2n,num(v.other2),"","etc"]);
    rows=rows.filter(r=>r[1]||/敷金|礼金|仲介/.test(r[0]));
    const sum=k=>rows.filter(r=>r[3]===k).reduce((a,r)=>a+r[1],0);
    return {rows,total:rows.reduce((a,r)=>a+r[1],0),m,rent,cm,cats:{rent:sum("rent"),dep:sum("dep"),fee:sum("fee"),etc:sum("etc")},days,md};
  },
  render(v){
    const c=this.calc(v), s=staff(num(v.staff)), P=st.P;
    const CAT=[["rent","家賃（日割・前家賃）","#2b3864"],["fee","礼金・仲介手数料","#367069"],["etc","保証・保険・鍵交換など","#5fa877"],["dep","敷金（お預け金）","#b9cfc6"]];
    const pct=x=>c.total?Math.max(0,x/c.total*100):0;
    const groups=[["rent","家賃・管理費"],["dep","お預けするお金"],["fee","契約にかかる費用"],["etc","保証・保険・その他"]];
    const mv=v.moveIn?jDate(v.moveIn,true):"—";
    const ratio=c.m?(c.total/c.m):0;
    return `<div class="sheet pl in">
      <div class="pl-top"></div>
      <div class="pl-head">
        <div><div class="pl-eyebrow">MOVE-IN COST ESTIMATE</div><h1>初期費用計算書 <span class="pl-chip">賃貸</span></h1></div>
        <div style="text-align:right"><div class="pl-cust">${esc(v.cust||"　　　　")}<small>様</small></div><div class="pl-date">作成日 ${jDate(v.date)}</div></div>
      </div>
      <div class="pl-prop">
        <div style="flex:1"><div class="pl-kl">物件</div><div class="pl-pn">${esc(P.name||"　")}</div><div class="pl-pa">${esc(P.address||"")}</div>
          <div class="pl-pa">${esc([P.layout,P.bldgArea,P.access].filter(Boolean).join("　／　"))}</div></div>
        <div class="pl-price"><div style="font-size:11px;opacity:.85">ご契約時のお支払い（概算）</div><div>${comma(c.total)}<small>円</small></div></div>
      </div>
      <div class="pl-kpis" style="grid-template-columns:repeat(4,1fr)">
        <div class="pl-kpi"><div class="pl-kl">賃料</div><div class="pl-kv">${comma(c.rent)}<small>円</small></div></div>
        <div class="pl-kpi"><div class="pl-kl">管理費・共益費</div><div class="pl-kv">${comma(c.cm)}<small>円</small></div></div>
        <div class="pl-kpi acc"><div class="pl-kl">毎月のお支払い</div><div class="pl-kv">${comma(c.m)}<small>円</small></div></div>
        <div class="pl-kpi"><div class="pl-kl">ご入居日</div><div class="pl-kv" style="font-size:14px;white-space:nowrap">${esc(mv)}</div></div>
      </div>
      <div class="in-sec">初期費用の内訳<small>合計 ${comma(c.total)}円${ratio?`（月額の約${ratio.toFixed(1)}ヶ月分）`:""}</small></div>
      <div class="in-bar">${CAT.map(([k,,col])=>c.cats[k]?`<div style="width:${pct(c.cats[k]).toFixed(2)}%;background:${col}"></div>`:"").join("")}</div>
      <div class="in-lg">${CAT.map(([k,l,col])=>`<span><i style="background:${col}"></i>${l}<b>${comma(c.cats[k])}円</b></span>`).join("")}</div>
      <div class="in-grid">

/* ---- 返済計画表 ---- */
function loanCalc(v){
  const P=num(v.loan)*1e4, Y=Math.max(1,Math.round(num(v.years))), n=Y*12;
  const bPct=Math.min(50,Math.max(0,num(v.bonusPct)));
  const Pb0=P*bPct/100, Pm0=P-Pb0;
  const r1=num(v.rate), r2=v.rate2===""||v.rate2===undefined?r1:num(v.rate2), sw=num(v.rateYears)>0&&v.rate2!==""?Math.round(num(v.rateYears)*12):Infinity;
  const kintou=v.method!=="元金均等";
  const [b1,b2]=String(v.bonusMonths||"6,12").split(",").map(Number);
  const [sy,sm]=String(v.start||"").split("-").map(Number); const y0=sy||new Date().getFullYear(), m0=sm||(new Date().getMonth()+2);
  let bm=Pm0, bb=Pb0, payM=0, payB=0, rows=[], acc={pay:0,prin:0,int:0}, first={m:0,b:0}, total=0, intTotal=0, curRate=r1;
  const amort=(bal,rate,k)=>{ const r=rate/100; if(!k) return bal; return r?bal*r/(1-Math.pow(1+r,-k)):bal/k; };
  const bonusLeft=i=>{ let c=0; for(let j=i;j<n;j++){ const cm=((m0-1+j)%12)+1; if(cm===b1||cm===b2) c++; } return c; };
  for(let i=0;i<n;i++){
    if(i===0||i===sw){ curRate=i<sw?r1:r2; if(kintou){ payM=amort(bm,curRate/12,n-i); const bl=bonusLeft(i); payB=bl?amort(bb,curRate/2,bl):0; } }
    const cm=((m0-1+i)%12)+1, isB=Pb0>0&&(cm===b1||cm===b2);
    // 月払い
    let int=bm*curRate/100/12, prin=kintou?payM-int:Pm0/n; if(i===n-1||prin>bm) prin=bm; bm-=prin;
    let pay=prin+int, bInt=0, bPrin=0;
    if(isB&&bb>0){ bInt=bb*curRate/100/2; if(kintou){ bPrin=payB-bInt; } else { const bl=bonusLeft(i); bPrin=bb/Math.max(1,bl); } if(bonusLeft(i+1)===0||bPrin>bb) bPrin=bb; bb-=bPrin; }
    if(i===0){ first.m=pay; } if(i===sw) first.after=pay; if(isB&&!first.b) first.b=bPrin+bInt;
    acc.pay+=pay+bPrin+bInt; acc.prin+=prin+bPrin; acc.int+=int+bInt;
    if(i%12===11||i===n-1){ const yr=Math.floor(i/12)+1; const sYM=new Date(y0,m0-1+(yr-1)*12,1), eYM=new Date(y0,m0-1+i,1);
      rows.push({yr,label:`${sYM.getFullYear()}.${sYM.getMonth()+1}〜${eYM.getFullYear()}.${eYM.getMonth()+1}`,rate:curRate,pay:acc.pay,prin:acc.prin,int:acc.int,bal:Math.max(0,bm+bb)});
      total+=acc.pay; intTotal+=acc.int; acc={pay:0,prin:0,int:0}; }
  }
  return {P,Y,rows,first,total,intTotal,bPct,kintou,r1,r2,sw,b1,b2,y0,m0};
}

/* ---- 賃貸 vs 購入 比較 ---- */
function rvbCalc(v,over){
  v=Object.assign({},v,over||{});
  const H=35, X=Math.min(H,Math.max(1,Math.round(num(v.X)||10)));
  const price=num(v.price)*1e4, down=num(v.down)*1e4, feeP=num(v.feePct)/100;
  const r=num(v.rate), yrs=Math.max(1,Math.round(num(v.years)||35)), age=num(v.age);
  const g=num(v.g)/100, rent0=num(v.rent), rg=num(v.rentG)/100, renew=num(v.renew);
  const mg0=num(v.mg), mgG=num(v.mgG)/100, taxY=num(v.taxY);
  const dCap=num(v.dedCap)*1e4, dYrs=Math.round(num(v.dedYears)), dMax=num(v.dedTax)||Infinity;
  const W=Math.max(1,Math.round(num(v.W)||5)), save=num(v.save), rC=v.rateC===""||v.rateC===undefined?r:num(v.rateC);
  const inv=num(v.invest)/100;
  const sellCost=p=>brokerageBase(p,false)*1.1+40000;
  const termFor=s=>age?Math.max(1,Math.min(yrs,80-(age+s))):yrs;
  // s: 購入する年（0=今、Infinity=賃貸のまま）
  function path(s,dn,rate){
    const out=[0], ded=[0], eq=[0], bal=[0], monthly1={};
    let cum=0, cumDed=0, B=0, pay=0, n=0, k=0, buyY=0, term=0, P0=0, fee=0;
    for(let m=0;m<H*12;m++){
      const y=Math.floor(m/12);
      if(m===s*12){ P0=price*Math.pow(1+g,s); fee=P0*feeP; buyY=y; term=termFor(s);
        const d=Math.min(dn,P0); B=Math.max(0,P0-d); n=term*12; k=0; pay=monthly(B,rate,term); cum+=d+fee; monthly1.pay=pay; monthly1.loan=B; monthly1.price=P0; monthly1.down=d; monthly1.fee=fee; monthly1.term=term; }
      if(m<s*12){ const rent=rent0*Math.pow(1+rg,y); cum+=rent; if(renew&&m>0&&m%24===0) cum+=rent*renew; }
      else{ if(k<n){ const it=B*rate/100/12; let pr=pay-it; if(k===n-1||pr>B) pr=B; B-=pr; cum+=pr+it; k++; }
        cum+=mg0*Math.pow(1+mgG,y)+taxY/12; }
      if(m%12===11){ const t=y+1;
        if(s<Infinity&&t>s&&t-s<=dYrs){ const dd=Math.min(Math.min(B,dCap)*0.007,dMax); cumDed+=dd; }
        let e=0; if(s<Infinity&&t*12>s*12){ const Pt=price*Math.pow(1+g,t); e=Pt-sellCost(Pt)-B; }
        else if(inv){ e=0; }
        out.push(cum); ded.push(cumDed); eq.push(e); bal.push(B); }
    }
    return {out,ded,eq,bal,m1:monthly1};
  }
  const A=path(0,down,r), Bp=path(Infinity,0,r), C=path(W,down+save*12*W,rC);
  // 手元資金の運用益（購入に使わなかったお金）
  const cash0=down+price*feeP;
  const gainB=t=>inv?cash0*(Math.pow(1+inv,t)-1):0;
  const gainC=t=>inv?cash0*(Math.pow(1+inv,Math.min(t,W))-1):0;
  const net=(p,t,gain)=>p.out[t]-p.ded[t]-p.eq[t]-(gain?gain(t):0);
  const series={A:[],B:[],C:[]};
  for(let t=0;t<=H;t++){ series.A.push(net(A,t)); series.B.push(net(Bp,t,gainB)); series.C.push(net(C,t,gainC)); }
  let be=null; for(let t=1;t<=H;t++){ if(series.A[t]<series.B[t]){ be=t; break; } }
  const mA=A.m1.pay+mg0+taxY/12, mC=C.m1.pay+mg0*Math.pow(1+mgG,W)+taxY/12;
  return {H,X,W,A,B:Bp,C,series,be,mA,mC,mgW:mg0*Math.pow(1+mgG,W),rent0,price,r,rC,yrs,age,g,termA:A.m1.term,termC:C.m1.term,gainB,cash0,sellCost};
}
const RVB_COL={A:"#367069",B:"#9aa5ab",C:"#2b3864"};
function rvbChart(c){
  const W=700,H=188,L=58,R=14,T=14,Bm=24, xs=t=>L+(W-L-R)*(t/c.H);
  const all=[...c.series.A,...c.series.B,...c.series.C].slice(1);
  let mx=Math.max(...all,1), mn=Math.min(0,...all);
  const step=[100,200,500,1000,2000,5000].map(s=>s*1e4).find(s=>(mx-mn)/s<=7)||1e8;
  mx=Math.ceil(mx/step)*step; mn=Math.floor(mn/step)*step;
  const ys=v=>T+(H-T-Bm)*(1-(v-mn)/(mx-mn||1));
  let g="";
  for(let v=mn;v<=mx+1;v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="${v===0?"#9aa5ab":"#e6ecee"}" stroke-width="1"/><text x="${L-6}" y="${ys(v)+3.5}" text-anchor="end" font-size="9.5" fill="#6b7a80">${comma(Math.round(v/1e4))}</text>`; }
  for(let t=0;t<=c.H;t+=5) g+=`<text x="${xs(t)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#6b7a80">${t}年</text>`;
  g+=`<text x="${L-6}" y="${T-4}" text-anchor="end" font-size="9" fill="#6b7a80">万円</text>`;
  g+=`<rect x="${xs(c.X)-1}" y="${T}" width="2" height="${H-T-Bm}" fill="#5fa877" opacity=".5"/><text x="${xs(c.X)+4}" y="${T+10}" font-size="9.5" fill="#367069" font-weight="700">${c.X}年後</text>`;
  const line=(arr,col,w,dash)=>`<polyline fill="none" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""} stroke-linejoin="round" points="${arr.map((v,t)=>`${xs(t).toFixed(1)},${ys(v).toFixed(1)}`).join(" ")}"/>`;
  g+=line(c.series.B,RVB_COL.B,2.4)+line(c.series.C,RVB_COL.C,2,"6 4")+line(c.series.A,RVB_COL.A,3.2);
  ["B","C","A"].forEach(k=>{ const v=c.series[k][c.X]; g+=`<circle cx="${xs(c.X)}" cy="${ys(v)}" r="4" fill="#fff" stroke="${RVB_COL[k]}" stroke-width="2.2"/>`; });
  if(c.be&&c.be!==c.X) g+=`<circle cx="${xs(c.be)}" cy="${ys(c.series.A[c.be])}" r="3" fill="${RVB_COL.A}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`;
}

const TSUBO=3.305785;
const firstNum=s=>{const m=String(s??"").replace(/[,，]/g,"").replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).match(/-?\d+(\.\d+)?/);return m?Number(m[0]):0};
function yearOf(s){ s=String(s||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  let m=s.match(/(\d{4})\s*[年\/\-.]\s*(\d{1,2})?/); if(m) return Number(m[1])+((Number(m[2]||6)-1)/12);
  const w=s.match(/(昭和|平成|令和|S|H|R)\s*(\d+|元)\s*年?\s*(\d{1,2})?/); if(w){const n=w[2]==="元"?1:Number(w[2]); const base={昭和:1925,平成:1988,令和:2018,S:1925,H:1988,R:2018}[w[1]]; return base+n+((Number(w[3]||6)-1)/12);}
  m=s.match(/^(\d{4})$/); if(m) return Number(m[1])+0.5; return 0; }
function dateOf(s){ s=String(s||""); const q=s.match(/(\d{4})年\s*第\s*(\d)\s*四半期/); if(q) return Number(q[1])+(Number(q[2])-1)*0.25+0.125;
  const r=s.match(/(\d{4})年\s*(\d{1,2})月\s*[~〜～\-]\s*(\d{1,2})月/); if(r) return Number(r[1])+((Number(r[2])+Number(r[3]))/2-1)/12; return yearOf(s); }
function ymLabel(s){ const d=dateOf(s); if(!d) return esc(s||""); const y=Math.floor(d), m=Math.round((d-y)*12)+1; return `${y}年${Math.min(12,m)}月`; }
function walkOf(s){ s=String(s??""); const m=s.match(/徒歩\s*(\d+)/); if(m) return Number(m[1]); return /^\s*\d+(\.\d+)?\s*分?\s*$/.test(s)?firstNum(s):0; }
const DIRS={"南":0,"南東":-1,"南西":-1,"東":-3,"西":-3,"北東":-6,"北西":-6,"北":-8};
function dirScore(d){ d=String(d||"").trim(); if(!d) return null; if(d in DIRS) return DIRS[d]; for(const k of ["南東","南西","北東","北西","南","東","西","北"]) if(d.includes(k)) return DIRS[k]; return null; }

function saSubj(){

function saCalc(){
  const S=saSubj(), K=S.kind||"mansion";
  const sDate=dateOf(S.date)||dateOf(today());
  const bval=(ar,built,at)=>{ if(!ar) return 0; const age=Math.max(0,at-(built||at)); const r=Math.max(num(S.bResid)/100,1-age/Math.max(1,num(S.bLife))); return num(S.bUnit)*1e4*ar*r; };
  const sArea=K==="mansion"?firstNum(S.area):firstNum(S.landArea);
  const sb=yearOf(S.built), sw=walkOf(S.walk)||walkOf(S.station), ds=dirScore(S.dir);
  const rows=st.saCases.map((c,i)=>{
    const price=num(c.price)*1e4, area=firstNum(c.area);
    if(!price||!area) return {c,i,ok:false};
    let base=price, bv=0;
    if(K==="house"){ bv=bval(firstNum(c.barea),yearOf(c.built),dateOf(c.date)||sDate); base=Math.max(price-bv,price*0.2); }
    const unit=base/area, f={};
    f.jijo=c.kind==="売出"?-num(S.sellGap):0;
    const cd=dateOf(c.date); f.time=cd?Math.round(num(S.timeRate)*(sDate-cd)*10)/10:0;
    const cb=yearOf(c.built); f.age=(K==="mansion"&&cb&&sb)?Math.round(num(S.agePct)*(sb-cb)*10)/10:0;
    f.floor=(K==="mansion"&&num(c.floor)&&num(S.floor))?num(S.floorPct)*(num(S.floor)-num(c.floor)):0;
    const cw=walkOf(c.walk); f.walk=(cw&&sw)?num(S.walkPct)*(cw-sw):0;
    const dc=dirScore(c.dir); f.dir=(S.dirOn&&K==="mansion"&&ds!==null&&dc!==null)?ds-dc:0;
    f.ind=num(c.adj);
    const raw=Object.values(f).reduce((x,y)=>x+y,0), t=Math.max(-40,Math.min(40,raw));
    return {c,i,ok:true,unit,adj:unit*(1+t/100),f,tot:t,bv,w:c.on===false?0:(c.kind==="売出"?num(S.wSale):num(S.wSold))};
  });
  const used=rows.filter(r=>r.ok&&r.w>0), wsum=used.reduce((x,r)=>x+r.w,0);
  const avg=wsum?used.reduce((x,r)=>x+r.adj*r.w,0)/wsum:0;
  const so=used.map(r=>r.adj).sort((x,y)=>x-y), n=so.length;
  const med=n?(n%2?so[(n-1)/2]:(so[n/2-1]+so[n/2])/2):0;
  // 公的価格指標
  const L=K==="mansion"?firstNum(S.mochibun):firstNum(S.landArea), tm=1+num(S.idxTime)/100;
  const idxList=[];
  if(num(S.koji)) idxList.push({k:"地価公示（公示地価）",name:S.kojiName,year:S.kojiYear,pub:`${comma(num(S.koji))}円/㎡`,adj:num(S.kojiAdj),u:num(S.koji)*tm*(1+num(S.kojiAdj)/100),how:`時点${pctTxt(num(S.idxTime))}・地点格差${pctTxt(num(S.kojiAdj))}`});
  if(num(S.kijun)) idxList.push({k:"都道府県地価調査（基準地価）",name:S.kijunName,year:S.kijunYear,pub:`${comma(num(S.kijun))}円/㎡`,adj:num(S.kijunAdj),u:num(S.kijun)*tm*(1+num(S.kijunAdj)/100),how:`時点${pctTxt(num(S.idxTime))}・地点格差${pctTxt(num(S.kijunAdj))}`});
  if(num(S.rosen)) idxList.push({k:"相続税路線価",name:S.rosenName,year:"",pub:`${comma(num(S.rosen))}千円/㎡`,adj:num(S.rosenAdj),u:num(S.rosen)*1000/0.8*(1+num(S.rosenAdj)/100),how:`÷0.8（公示水準へ換算）・補正${pctTxt(num(S.rosenAdj))}`});
  if(num(S.kotei)&&L) idxList.push({k:"固定資産税評価額（土地）",name:"",year:"",pub:`${comma(num(S.kotei))}円`,adj:0,u:num(S.kotei)/L/0.7,how:"÷土地面積÷0.7（公示水準へ換算）"});
  const idxUnit=idxList.length?idxList.reduce((x,o)=>x+o.u,0)/idxList.length:0;
  const wDef=K==="land"?30:K==="house"?20:0, w=Math.max(0,Math.min(100,S.idxWeight===""||S.idxWeight===undefined?wDef:num(S.idxWeight)))/100;
  const landUnit=(K!=="mansion"&&idxUnit&&avg)?avg*(1-w)+idxUnit*w:avg;
  const idx={list:idxList,unit:idxUnit,w:K==="mansion"?0:w,caseUnit:avg,landUnit,L,gap:(idxUnit&&avg&&K!=="mansion")?(avg/idxUnit-1)*100:(idxUnit&&K==="mansion")?null:null};
  let hikaku=landUnit*sArea, sBv=0;
  if(K==="house"){ sBv=bval(firstNum(S.bldgArea),sb,sDate); hikaku+=sBv; }
  const evalPct=st.saEval.reduce((x,e)=>x+num(e[1]),0);
  const seiyaku=hikaku*(1+evalPct/100);
  const step=(num(S.round)||10)*1e4, R=x=>Math.round(x/step)*step;
  const plans={ std:num(S.ovStd)?num(S.ovStd)*1e4:R(seiyaku*(1+num(S.pStd)/100)),
    speed:num(S.ovSpeed)?num(S.ovSpeed)*1e4:R(seiyaku*(1+num(S.pSpeed)/100)),
    chal:num(S.ovChal)?num(S.ovChal)*1e4:R(seiyaku*(1+num(S.pChal)/100)) };
  return {S,K,rows,used,avg,med,min:so[0]||0,max:so[n-1]||0,hikaku,sBv,sArea,evalPct,seiyaku,plans,sDate,idx};
}

function saScatterSVG(C){

  const X=v=>50+(v-x0)/(x1-x0)*(W-70), Y=v=>H-30-(v-y0)/(y1-y0)*(H-50);

/* 国交省 不動産情報ライブラリ CSV */
function parseCSV(text){ const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===","){ row.push(cur); cur=""; } else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(ch!=="\r") cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); } return rows; }
async function saCsv(file){
  try{
    const buf=await file.arrayBuffer(); let text=new TextDecoder("utf-8").decode(buf);
    if(text.includes(String.fromCharCode(0xFFFD))||!/取引価格|種類/.test(text.slice(0,2000))){ try{ text=new TextDecoder("shift_jis").decode(buf); }catch(e){} }
    const rows=parseCSV(text.replace(/^﻿/,"")); const H=rows[0]||[]; const ix=name=>H.findIndex(h=>h.replace(/\s/g,"").includes(name));
    const I={type:ix("種類"),city:ix("市区町村名"),area:ix("地区名"),st:ix("最寄駅：名称"),walk:ix("最寄駅：距離"),price:ix("取引価格（総額）"),lay:ix("間取り"),men:ix("面積（㎡）"),bldg:ix("延床面積"),year:ix("建築年"),struct:ix("建物の構造"),when:ix("取引時期"),pref:ix("都道府県名")};
    if(I.price<0) throw new Error("国交省の取引価格CSVの形式ではないようです");
    const K=saSubj().kind, kw=($("#saCsvArea")&&$("#saCsvArea").value.trim())||"";
    const want=K==="mansion"?/中古マンション/:K==="house"?/宅地\(土地と建物\)|宅地（土地と建物）/:/宅地\(土地\)|宅地（土地）/;
    const sDate=dateOf(saSubj().date)||dateOf(today());
    let list=rows.slice(1).filter(r=>r.length>5&&want.test(r[I.type]||"")&&(!kw||String(r[I.area]||"").includes(kw)));
    list=list.map(r=>({r,d:dateOf(r[I.when])})).filter(x=>!x.d||sDate-x.d<=5).sort((a,b)=>b.d-a.d).slice(0,30);
    for(const {r} of list){
      const p=num(r[I.price]); if(!p) continue; const w=String(r[I.walk]||"");
      st.saCases.push({on:true,kind:"成約",date:r[I.when]||"",name:"",addr:[r[I.pref],r[I.city],r[I.area]].filter(Boolean).join(""),price:String(Math.round(p/1e4)),area:String(firstNum(r[I.men])),barea:I.bldg>=0?String(firstNum(r[I.bldg])||""):"",built:r[I.year]||"",floor:"",dir:"",walk:/^\d+$/.test(w)?w:(w.match(/(\d+)分/)||[,""])[1],layout:I.lay>=0?r[I.lay]:"",src:"国土交通省 不動産情報ライブラリ",adj:""});
    }
    saSave(); renderSaTable(); saRefresh();
    setSaStatus(list.length?`CSVから${list.length}件を追加しました（${KIND_LABEL[K]}・${kw||"全地区"}・直近5年・新しい順に最大30件）。`:`条件に合う事例がありませんでした（${KIND_LABEL[K]}・「${kw}」）。絞り込みの町名を変えてお試しください。`,!list.length);
  }catch(e){ setSaStatus("CSVを読み込めませんでした："+(e.message||e),true); }
}

async function drawBand(srcCanvas,ov){

function bbIdx(it){ return $("#bbPages")&&$("#bbPages").value==="first"?[0]:it.pages.map((_,i)=>i); }
let bbPainting=0;
async function paintBatch(){
  const box=$("#bbList"); if(!box) return; const my=++bbPainting;
  $("#bbDl").disabled=!st.batch.length;
  if(!st.batch.length){ box.innerHTML=""; return; }
  await document.fonts.ready;
  const total=st.batch.reduce((a,it)=>a+bbIdx(it).length,0);
  box.innerHTML=`<div class="muted" style="grid-column:1/-1">${st.batch.length}ファイル・${total}ページ</div>`;
  for(let fi=0;fi<st.batch.length;fi++){ const it=st.batch[fi];
    for(const pi of bbIdx(it)){
      if(my!==bbPainting) return;
      const c=await drawBand(it.pages[pi],it.ov[pi]); const r=300/c.width; const t=document.createElement("canvas"); t.width=300; t.height=Math.round(c.height*r); t.getContext("2d").drawImage(c,0,0,t.width,t.height);
      const el=document.createElement("div"); el.className="bb-item";
      el.innerHTML=`<div class="bb-h"><span title="${esc(it.name)}">${esc(it.name)}${it.pages.length>1?`　p.${pi+1}`:""}</span><button class="bb-x" title="このファイルを外す">×</button></div>`;
      t.className="bandpv"; t.style.cursor="crosshair"; t.title="タップした位置にこの図面の帯を移動";
      t.onclick=e=>{ const rc=t.getBoundingClientRect(); const yPct=(e.clientY-rc.top)/rc.height*100; it.ov[pi]={pos:"custom",y:Math.round((yPct-num(SET.bandPct)/2)*10)/10}; paintBatch(); };
      el.appendChild(t);
      if(it.ov[pi]){ const b=document.createElement("button"); b.className="btn sm ghost bb-reset"; b.textContent="帯の位置を全体の設定に戻す"; b.onclick=()=>{ delete it.ov[pi]; paintBatch(); }; el.appendChild(b); }
      el.querySelector(".bb-x").onclick=()=>{ st.batch.splice(fi,1); paintBatch(); };
      box.appendChild(el);
      await new Promise(r=>setTimeout(r,0));
    }
  }
}
async function downloadBatch(){
  if(!st.batch.length) return;
  const {jsPDF}=window.jspdf; const each=$("#bbOut").value==="each";
  const total=st.batch.reduce((a,it)=>a+bbIdx(it).length,0); let n=0, pdf=null;
  const addPage=(c)=>{ const land=c.width>c.height; const pw=land?297:210, ph=land?210:297;
    if(!pdf) pdf=new jsPDF({orientation:land?"l":"p",unit:"mm",format:"a4",compress:true}); else pdf.addPage("a4",land?"l":"p");
    const r=Math.min(pw/c.width,ph/c.height); const w=c.width*r,h=c.height*r; pdf.addImage(c.toDataURL("image/jpeg",0.88),"JPEG",(pw-w)/2,(ph-h)/2,w,h); };
  try{
    $("#bbDl").disabled=true;
    for(const it of st.batch){
      for(const pi of bbIdx(it)){ n++; bbStatus(`PDFを作成中… ${n}/${total}ページ`); addPage(await drawBand(it.pages[pi],it.ov[pi])); await new Promise(r=>setTimeout(r,0)); }
      if(each){ await saveFile(pdf.output("blob"),`${it.name}_sIgNaL.pdf`); pdf=null; }
    }
    if(!each){ const d=new Date(); await saveFile(pdf.output("blob"),`販売図面_帯替え_${st.batch.length}件_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.pdf`); }
    bbStatus(`${st.batch.length}件・${total}ページの帯替えPDFを保存しました。`);
  }catch(e){ bbStatus("PDFの作成に失敗しました："+(e.message||e),true); }
  finally{ $("#bbDl").disabled=!st.batch.length; }
}

const YD_LIFE={RC:47,SRC:47,"重量鉄骨":34,"軽量鉄骨":27,"木造":22};
const YD_UNIT={RC:20,SRC:22,"重量鉄骨":18,"軽量鉄骨":15,"木造":15};
function ydDefaults(){
  const P=st.P, ittou=/一棟|ビル|アパート/.test(P.kind||"")||!/区分|マンション/.test(P.kind||"");
  const st0=String(P.structure||""); const struct=/SRC|鉄骨鉄筋/.test(st0)?"SRC":/RC|鉄筋コンクリート/.test(st0)?"RC":/軽量/.test(st0)?"軽量鉄骨":/鉄骨|S造/.test(st0)?"重量鉄骨":/木/.test(st0)?"木造":"RC";
  return { type:ittou?"ittou":"kubun", price:P.price||"", income:P.income||"", vacancy:ittou?5:0,
    mgmtPct:5, taxes:"", repairPct:ittou?3:0, insurance:"", otherOpex:"", kubunMgmt:(num(P.mgmtFee)+num(P.repairFund))||"",
    costPct:7, loanPct:90, rate:2.0, years:30,
    landArea:firstNum(P.landArea)||"", rosen:"", bldgArea:firstNum(P.bldgArea)||"", struct, built:P.built||"",
    targetYield:"", exitYield:"", hold:10 };
}
function ydVals(){ st.yd=st.yd||{}; const d=ydDefaults(); const o={}; for(const k in d) o[k]=(st.yd[k]!==undefined&&st.yd[k]!=="")?st.yd[k]:d[k]; return o; }
function ydCalc(v){
  const price=num(v.price)*1e4, gpi=num(v.income)*1e4, it=v.type==="ittou";
  const egi=gpi*(1-num(v.vacancy)/100);
  const opexRows=it?[["管理委託料",egi*num(v.mgmtPct)/100],["固定資産税・都市計画税",num(v.taxes)*1e4],["修繕費",gpi*num(v.repairPct)/100],["損害保険料",num(v.insurance)*1e4],["その他（共用部光熱費等）",num(v.otherOpex)*1e4]]
    :[["管理費・修繕積立金",num(v.kubunMgmt)*12],["賃貸管理手数料",egi*num(v.mgmtPct)/100],["固定資産税・都市計画税",num(v.taxes)*1e4],["損害保険料",num(v.insurance)*1e4],["その他",num(v.otherOpex)*1e4]];
  const opex=opexRows.reduce((a,r)=>a+r[1],0), noi=egi-opex;
  const cost=price*num(v.costPct)/100, total=price+cost, loan=price*num(v.loanPct)/100, equity=total-loan;
  const ads=monthly(loan,num(v.rate),num(v.years))*12, cf=noi-ads;
  // 積算評価
  const age=Math.max(0,(new Date().getFullYear()+new Date().getMonth()/12)-(yearOf(v.built)||new Date().getFullYear()));
  const life=YD_LIFE[v.struct]||47, remain=Math.max(0,life-age);
  const landV=num(v.rosen)*1000*firstNum(v.landArea), bldgV=(YD_UNIT[v.struct]||20)*1e4*firstNum(v.bldgArea)*(life?remain/life:0);
  const sekisan=it?landV+bldgV:0;
  return { price,gpi,egi,opexRows,opex,noi,cost,total,loan,equity,ads,cf,age,life,remain,landV,bldgV,sekisan,
    surface:price?gpi/price*100:0, net:total?noi/total*100:0, ccr:equity>0?cf/equity*100:0, dscr:ads?noi/ads:0,
    ber:gpi?(opex+ads)/gpi*100:0, repayRatio:gpi?ads/gpi*100:0,
    byTarget:num(v.targetYield)?gpi/(num(v.targetYield)/100):0, exitPrice:num(v.exitYield)?noi/(num(v.exitYield)/100):0 };
}

async function fileToCanvases(file,maxW=2000,maxPages=4){
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib) throw new Error("PDF読込ライブラリを読み込めませんでした");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    const out=[]; for(let i=1;i<=Math.min(pdf.numPages,maxPages);i++){ const pg=await pdf.getPage(i); const vp0=pg.getViewport({scale:1});
      const vp=pg.getViewport({scale:Math.min(4,maxW/vp0.width)}); const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); await pg.render({canvasContext:g,viewport:vp}).promise; out.push(c); }
    return out;
  }
  const url=URL.createObjectURL(file);
  try{ const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("画像を開けません"));i.src=url});
    const r=Math.min(1,maxW/im.width); const c=document.createElement("canvas"); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); return [c]; }
  finally{ URL.revokeObjectURL(url); }
}
function setStatus(m,err){ const s=$("#readStatus"); s.textContent=m; s.classList.toggle("show",!!m); s.classList.toggle("err",!!err); }

function renderPagePick(){

    return `<button data-i="${i}" class="${i===st.sel?"on":""}" title="${i+1}ページ目を使う"><img src="${t.toDataURL("image/jpeg",0.6)}"><span>${i+1}</span></button>`; }).join("") : "";

/* ================= AI (sample) ================= */
let samplerP=null; function sampler(){ if(!samplerP){
  if(MODE==="gas"){ const f=async(input,opts={})=>{ const images=await Promise.all((opts.images||[]).map(blobToB64));
      const r=await api("ai",{prompt:typeof input==="string"?input:input.map(m=>m.content).join("\n\n"),images});
      if(opts.onText) opts.onText({text:r.text,delta:r.text}); return {text:r.text,truncated:false}; };
    f.limits=async()=>({images:true}); samplerP=Promise.resolve(f); }
  else samplerP=(window.claude&&window.claude.use)?window.claude.use("sample"):Promise.resolve(null); }
  return samplerP; }
const EXTRACT_KEYS={deal:"'sale'（売買）か'rent'（賃貸）",name:"物件名（マンション名・○○町○丁目戸建 等）",kind:"種別：土地/新築戸建/中古戸建/中古マンション/新築マンション/一棟アパート/一棟マンション/区分収益/店舗・事務所/ビル/その他",address:"所在地（住居表示。図面の記載どおり。都道府県から）",chiban:"地番",kaoku:"家屋番号",station:"交通（路線・駅・徒歩分）",landArea:"土地面積（単位・公簿/実測の別も記載どおり）",bldgArea:"建物面積または専有面積",layout:"間取り",structure:"構造・階建・所在階",built:"築年月（例：2005年3月）",price:"売買価格（万円の数値。例 6450）",mgmtFee:"管理費 月額（円の数値）",income:"収益物件の満室想定年収・年間賃料収入（万円の数値。月額表記なら12倍。現況年収しかなければそれ）",repairFund:"修繕積立金 月額（円の数値）",rent:"賃料 月額（円の数値）",commonFee:"管理費・共益費 月額（円の数値）",deposit:"敷金（ヶ月数の数値）",keyMoney:"礼金（ヶ月数の数値）",guarantee:"保証会社に関する記載",rentInsurance:"火災保険料（円の数値）",keyChange:"鍵交換費（円の数値）",rentOther:"その他初期費用の合計（円の数値）",motoCompany:"元付業者（図面を作成した業者）の会社名。帯や枠に記載",motoBranch:"元付業者の支店・店舗名",motoTel:"元付業者TEL",motoFax:"元付業者FAX",motoPerson:"元付業者の担当者名",torihiki:"取引態様",commission:"手数料・分かれ等の条件",adOk:"広告転載の可否（例：広告可・承諾不要／広告不可／要承諾。記載がなければ空）",remarks:"その他重要事項の要約（用途地域・建ぺい率/容積率・接道・現況・引渡時期など、記載があるもののみ。150字以内）"};
async function extractWithAI(){
  if(!st.pages.length) return;
  const sample=await sampler();
  if(!sample){ setStatus("このビューではAI読取が使えません。claude.aiでアプリを開くか、物件情報を手入力してください。",true); return; }
  try{ const lim=sample.limits?await sample.limits():{images:true}; if(lim&&lim.images===false){ setStatus("画像の読取が許可されていません。物件情報を手入力してください。",true); return; } }catch(e){}
  setStatus(`AIが図面${st.pages.length>1?`（${st.sel+1}ページ目）`:""}を読み取っています…（10〜30秒）`);
  const blobs=await Promise.all([st.pages[st.sel]].map(c=>{ const r=Math.min(1,2000/Math.max(c.width,c.height)); const d=document.createElement("canvas"); d.width=c.width*r; d.height=c.height*r; d.getContext("2d").drawImage(c,0,0,d.width,d.height); return new Promise(res=>d.toBlob(res,"image/jpeg",0.88)); }));
  const prompt=`あなたは日本の不動産業者のアシスタントです。添付は不動産の販売図面（マイソク）1ページです。図面に書かれている情報だけを読み取り、次のキーを持つJSONオブジェクト1つだけを出力してください（前後に文章やコードブロックを付けない）。
ルール：
- 図面に記載がない・読めない項目は空文字 "" にする。推測・補完は絶対にしない。
- 数値指定の項目は数値（カンマ・単位なし）。読めなければ ""。
- 文字は図面の表記どおり（全角半角は自然に）。
- 1枚に複数の号棟・区画が載っている場合は、価格が最も目立つ号棟（なければ最初の号棟）を対象にし、remarksに「他に○号棟あり」と書く。
- 元付業者は図面下部や枠内の業者帯（会社名・TEL/FAX・免許番号）から読む。取引態様が「売主」なら元付会社＝売主。
キー：
${Object.entries(EXTRACT_KEYS).map(([k,d])=>`- ${k}: ${d}`).join("\n")}`;
  try{
    const r=await sample(prompt,{images:blobs,modelTier:"default"});
    const t=(r&&r.text)||""; const m=t.match(/\{[\s\S]*\}/); if(!m) throw new Error("読み取り結果を解析できませんでした");
    const o=JSON.parse(m[0]); let n=0;
    for(const k of Object.keys(EXTRACT_KEYS)){ if(k==="deal") continue; const val=o[k]; if(val!==undefined&&val!==null&&val!==""){ st.P[k]=String(val); n++; } }
    if(o.deal==="rent"||o.deal==="sale"){ if(o.deal!==st.mode){ st.mode=o.deal; renderTabs(); } }
    renderPropForm(); onDataChange();
    setStatus(`読み取り完了：${n}項目を入力しました（${st.mode==="sale"?"売買":"賃貸"}として判定）。内容を確認してください。`); if(st.tab==="band") paintBand();
  }catch(e){
    if(e&&e.code==="not_granted") setStatus("AI読取が許可されませんでした。物件情報を手入力してください。",true);
    else if(e&&e.code==="rate_limited") setStatus("AIが混み合っています。少し待って「AIで再読取」を押してください。",true);
    else setStatus("AI読取に失敗しました："+(e.message||e)+"　手入力するか再読取してください。",true);
  }
}
async function aiCopywrite(){
  const out=$("#aiOut"); const sample=await sampler(); if(!sample){ out.textContent="このビューではAIが使えません。"; return; }
  const P=Object.fromEntries(Object.entries(st.P).filter(([k,v])=>v!==""&&v!==undefined));
  if(!Object.keys(P).length){ out.textContent="先にマイソクを読み込むか、物件情報を入力してください。"; return; }
  const kind=$("#aiKind").value;
  const prompt=`日本の不動産会社「${SET.company}」の営業担当（${staff().name}）として、${kind}の文章を作成してください。
物件情報（JSON）：${JSON.stringify(P)}
取引：${st.mode==="sale"?"売買":"賃貸"}
宛名：${$("#aiTo").value||"（なし）"}
補足：${$("#aiNote").value||"（なし）"}
ルール：物件情報にない事実（周辺施設、日当たり、眺望、リフォーム歴など）は書かない。誇大表現（最高・絶対・日本一など）や不当表示にあたる表現を使わない。${/仕入会社/.test(kind)?"手数料欄は空欄のまま「手数料：」とだけ書く。":""}${/LINE/.test(kind)?"200字程度。":/SNS/.test(kind)?"ハッシュタグを3〜5個付ける。":/メール/.test(kind)?"件名から書く。署名は会社名と担当者名のみ。":""}本文のみを出力。`;
  out.textContent="作成中…";
  try{ await sample(prompt,{onText:({text})=>{out.textContent=text}, cache:false}); }catch(e){ out.textContent="作成できませんでした："+(e.message||e.code||e); }
}

/* ================= PDF ================= */
async function renderSheetCanvas(id){
  const host=$("#render"); host.innerHTML=DOCS[id].render(docVals(id));
  await document.fonts.ready; await Promise.all($$("img",host).map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  const c=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:"#fff",useCORS:true,logging:false});
  host.innerHTML=""; return c;
}
async function downloadDocs(ids,filename){
  if(!window.jspdf||!window.html2canvas) return toast("PDFライブラリを読み込めませんでした。再読み込みしてください");
  toast("PDFを作成中…",8000);
  try{
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"mm",format:"a4"});
    for(let i=0;i<ids.length;i++){ const id=ids[i];
      if(id==="__band"){ const bi=bandIdx(); for(let j=0;j<bi.length;j++){ const c=await drawBand(st.pages[bi[j]]); const land=c.width>c.height; if(i||j) pdf.addPage("a4",land?"l":"p"); else if(land){ pdf.deletePage(1); pdf.addPage("a4","l"); }
          const pw=land?297:210,ph=land?210:297,r=Math.min(pw/c.width,ph/c.height); pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",(pw-c.width*r)/2,(ph-c.height*r)/2,c.width*r,c.height*r); } continue; }
      const c=await renderSheetCanvas(id); if(i) pdf.addPage("a4","p"); pdf.addImage(c.toDataURL("image/jpeg",0.93),"JPEG",0,0,210,297);
    }
    await saveFile(pdf.output("blob"),filename);
  }catch(e){ toast("PDF作成に失敗しました："+(e.message||e),5000); }
}
let dlP=null;
async function saveFile(blob,filename){
  if(MODE==="gas"){ const fn=filename.replace(/[\\/:*?"<>|]/g,"_");
    try{ const file=new File([blob],fn,{type:"application/pdf"}); if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:fn}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fn; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000); toast("保存しました"); return; }
  if(!dlP) dlP=(window.claude&&window.claude.use)?window.claude.use("downloads"):Promise.resolve(null);
  const dl=await dlP;
  if(!dl){ toast("この表示ではダウンロードできません。claude.aiのアプリページで開いてください",5000); return; }
  try{ await dl.save({filename:filename.replace(/[\\/:*?"<>|]/g,"_"),data:blob}); toast("保存しました"); }
  catch(e){ if(e&&e.code==="declined") toast("保存をキャンセルしました"); else if(e&&e.code==="rate_limited") toast("保存確認が開いています。閉じてから再度お試しください"); else toast("保存できませんでした（"+((e&&e.code)||e)+"）",4000); }
}
$("#bundleBtn").onclick=()=>{
  const ids=[]; if(st.pages.length) ids.push("__band"); ids.push(st.mode==="sale"?"plan":"init","hazard");
  downloadDocs(ids,`${st.P.name||"物件"}_資料一式.pdf`);
};

/* GitHub版：ログイン確認・利用者（担当者）の取得・今月の金利の読込 */
if(MODE==="gas"){
  if(!TOKEN) showGate("login");
  else api("me").then(r=>{
    const old=staffList(); const users=r.users||[];
    if(users.length){ SET.staff=users.map(u=>{ const o=old.find(x=>x.name.replace(/\s|　/g,"")===String(u.name).replace(/\s|　/g,""))||{};
        return [u.name,o.title||(u.role==="管理者"?"代表取締役":""),u.mobile||o.mobile||"",u.mail||o.mail||"",u.email].join(","); }).join("\n"); }
    const L=staffList(), idx=L.findIndex(x=>x.login===String(r.me&&r.me.email||"").toLowerCase());
    if(idx>=0) SET.staffIdx=idx; saveSettings(); st.docs={}; Object.keys(st.touched).filter(k=>/\.staff$/.test(k)).forEach(k=>delete st.touched[k]); renderView();

  }).catch(e=>{ if(!/ログイン|利用者/.test(e.message)) toast(e.message,5000); });
  fetch("rates.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.list){ Object.assign(RATES,j); if(st.tab==="tools") paintRates(); } }).catch(()=>{});
}
/* 閲覧者に合わせて担当者を自動選択（帯・各書類の担当が切り替わる） */
(async()=>{ try{ if(!(window.claude&&window.claude.use)) return; const u=await window.claude.use("user"); if(!u) return;
  const me=await u.me(); const L=staffList(); let idx=-1;
  if(me.email){ idx=L.findIndex(x=>x.login&&x.login===String(me.email).toLowerCase()); }
  if(idx<0&&me.isOwner) idx=0;
  if(idx>=0&&idx!==num(SET.staffIdx)){ SET.staffIdx=idx; saveSettings(); st.docs={}; Object.keys(st.touched).filter(k=>/\.staff$/.test(k)).forEach(k=>delete st.touched[k]); renderView(); }
  if(idx>=0) toast(`担当者：${L[idx].name}`);
}catch(e){} })();
document.fonts&&document.fonts.ready.then(()=>{ if(DOCS[st.tab]) paintPreview(st.tab); });
